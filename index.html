function YeongilShareSite() {
  const [filters, setFilters] = useState({
    age: "전체",
    topic: "전체",
  });
  const [activeModal, setActiveModal] = useState(null);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [filterPanelOpen, setFilterPanelOpen] = useState(false);

  const resourcesRef = useRef(null);
  const homeRef = useRef(null);

  /* 모달 열렸을 때 esc 키, 스크롤 잠금 */
  useEffect(() => {
    if (!activeModal) return;
    const handler = (e) => {
      if (e.key === "Escape") setActiveModal(null);
    };
    document.addEventListener("keydown", handler);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", handler);
      document.body.style.overflow = prev;
    };
  }, [activeModal]);

  const scrollTo = (ref) => {
    setMobileNavOpen(false);
    if (ref?.current) {
      ref.current.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  };

  /* 필터 적용 */
  const filtered = useMemo(() => {
    return sampleResources.filter((r) => {
      if (filters.age !== "전체" && r.age !== filters.age) return false;
      if (filters.topic !== "전체" && r.topic !== filters.topic) return false;
      return true;
    });
  }, [filters]);

  const activeFilterChips = Object.entries(filters)
    .filter(([, v]) => v !== "전체")
    .map(([k, v]) => ({ key: k, value: v }));

  const resetFilters = () => {
    setFilters({
      age: "전체",
      topic: "전체",
    });
  };

  const openResource = (link) => {
    if (!link) return;
    // 한글 파일명을 모든 환경(file://, GitHub Pages 등)에서 안정적으로 열기 위한 인코딩
    const safe = /^https?:\/\//i.test(link) ? link : encodeURI(link);
    window.open(safe, "_blank", "noopener,noreferrer");
  };

  return (
    <div
      style={{
        backgroundColor: COLORS.bg,
        color: COLORS.text,
        fontFamily: FONT_STACK,
      }}
      className="min-h-screen w-full"
      ref={homeRef}
    >
      {/* ============== 상단 고정 메뉴 ============== */}
      <Header
        onMenuClick={() => setMobileNavOpen((v) => !v)}
        mobileNavOpen={mobileNavOpen}
        scrollTo={scrollTo}
        targets={{
          home: homeRef,
          resources: resourcesRef,
        }}
      />

      {/* ============== Hero ============== */}
      <Hero
        onPrimary={() => scrollTo(resourcesRef)}
        onSecondary={() => scrollTo(resourcesRef)}
      />

      {/* ============== 자료 특징 3카드 ============== */}
      <FeatureCards />

      {/* ============== 검색 + 필터 + 자료 그리드 ============== */}
      <section ref={resourcesRef} className="px-5 sm:px-8 lg:px-16 pt-16 pb-12">

      onClick={onClose}
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div
        className="relative w-full sm:max-w-2xl max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl"
        style={{ backgroundColor: COLORS.card }}
        onClick={(e) => e.stopPropagation()}
      >
        {/* 헤더 (썸네일) */}
        <div
          className="relative px-7 pt-8 pb-6"
          style={{ backgroundColor: accent.bg }}
        >
          <button
            onClick={onClose}
            className="absolute top-4 right-4 w-9 h-9 rounded-full flex items-center justify-center hover:bg-white/70 focus:outline-none focus-visible:ring-2"
            style={{ backgroundColor: "rgba(255,255,255,0.6)" }}
            aria-label="닫기"
          >
            <X size={18} />
          </button>

          <div className="flex items-start gap-4">
            <div
              className="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl flex-shrink-0"
              style={{ backgroundColor: COLORS.card }}
            >
              {resource.icon}
            </div>
            <div className="flex-1 pr-8">
              {stage && (
                <span
                  className="inline-flex items-center gap-1.5 text-[11px] font-extrabold px-2.5 py-1 rounded-full mb-2"
                  style={{
                    backgroundColor: COLORS.card,
                    color: COLORS.text,
                  }}
                >
                  <span style={{ color: stage.color }}>●</span>
                  PLAY-ON · {resource.playOnStage} {stage.name}
                </span>
              )}
              <h2
                id="modal-title"
                className="text-xl sm:text-2xl font-extrabold leading-tight"
              >
                {resource.title}
              </h2>
            </div>
          </div>
        </div>

        {/* 본문 */}
        <div className="px-6 sm:px-7 py-6 space-y-6">
          <p
            className="text-sm sm:text-base leading-relaxed"
            style={{ color: COLORS.text }}
          >
            {resource.longDescription}
          </p>

          {/* 메타 그리드 */}
          <div
            className="grid grid-cols-2 sm:grid-cols-4 gap-3 p-4 rounded-2xl"
            style={{ backgroundColor: COLORS.bg }}
          >
            <ModalMeta label="대상 연령" value={resource.age} />
            <ModalMeta label="자료 유형" value={resource.type} />
            <ModalMeta label="활용 주제" value={resource.topic} />
            <ModalMeta
              label="활용 기기"
              value={resource.device.join(", ")}
            />
          </div>

          {/* 준비물 */}
          <ModalSection
            title="준비물"
            color={COLORS.yellow}
            text={resource.materials}
          />

          {/* 활용 방법 */}
          <ModalSection
            title="활용 방법"
            color={COLORS.green}
            text={resource.howToUse}
          />

          {/* 교사용 팁 */}
          <ModalSection
            title="교사용 팁"
            color={COLORS.pink}
            text={resource.teacherTip}
          />

          {/* 태그 */}
          {resource.tags && (
            <div
              className="flex flex-wrap gap-1.5 text-xs"
              style={{ color: COLORS.textMuted }}
            >
              {resource.tags.map((t) => (
                <span key={t}>#{t}</span>
              ))}
            </div>
          )}
        </div>

        {/* 푸터 액션 */}
        <div
          className="sticky bottom-0 px-6 sm:px-7 py-4 border-t flex flex-col sm:flex-row gap-2"
          style={{
            backgroundColor: COLORS.card,
            borderColor: COLORS.border,
          }}
        >
          <button
            onClick={onClose}
            className="sm:flex-1 inline-flex items-center justify-center gap-2 py-3 rounded-full font-bold text-sm"
            style={{
              backgroundColor: COLORS.bg,
              color: COLORS.text,
              border: `1.5px solid ${COLORS.border}`,
            }}
          >
            닫기
          </button>
          <button
            onClick={onRun}
            className="sm:flex-[2] inline-flex items-center justify-center gap-2 py-3 rounded-full font-bold text-sm"
            style={{ backgroundColor: COLORS.text, color: "#FFFFFF" }}
          >
            실행하기
            <ExternalLink size={15} />
          </button>
        </div>
      </div>
    </div>
  );
}

function ModalMeta({ label, value }) {
  return (
    <div>
      <div
        className="text-[11px] font-bold mb-0.5 tracking-wider"
        style={{ color: COLORS.textMuted }}
      >
        {label.toUpperCase()}
      </div>
      <div className="text-sm font-bold leading-snug">{value}</div>
    </div>
  );
}

function ModalSection({ title, color, text }) {
  return (
    <div>
      <div className="flex items-center gap-2 mb-2">
        <span
          className="w-1.5 h-5 rounded-full"
          style={{ backgroundColor: color }}
        />
        <h3 className="font-extrabold text-sm tracking-tight">{title}</h3>
      </div>
      <p
        className="text-sm leading-relaxed pl-3.5"
        style={{ color: COLORS.text }}
      >
        {text}
      </p>
    </div>
  );
}

/* =========================================================
   푸터
   ========================================================= */
function Footer() {
  return (
    <footer
      className="px-5 sm:px-8 lg:px-16 py-12 mt-4"
      style={{
        backgroundColor: COLORS.text,
        color: "#FFFFFF",
      }}
    >
      <div className="max-w-7xl mx-auto grid gap-8 md:grid-cols-2 items-start">
        <div>
          <div className="flex items-center gap-2 mb-3">
            <span
              className="w-9 h-9 rounded-2xl flex items-center justify-center text-lg"
              style={{ backgroundColor: COLORS.yellow }}
            >
              🌼
            </span>
            <span className="font-extrabold text-base">
              영일유치원 교육자료 나눔터
            </span>
          </div>
          <p className="text-sm opacity-80 leading-relaxed max-w-md">
            아이들의 놀이와 배움이 이어지는 자료를 함께 나눕니다. 선생님들의
            작은 자료가 모여 더 풍성한 배움이 됩니다.
          </p>
        </div>
        <div className="md:text-right">
          <div className="text-xs opacity-60 leading-relaxed">
            © 영일유치원 교육자료 나눔터
            <br />
            본 자료는 교육적 활용을 목적으로 제작되었습니다.
            <br />
            상업적 사용 및 무단 배포를 금합니다.
          </div>
        </div>
      </div>
    </footer>
  );
}

/* ================== Render ================== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<YeongilShareSite />);
</script>
</body>
</html>
