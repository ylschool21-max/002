const UI = {"metaDesc":"영일유치원 선생님들이 함께 만드는 AI·디지털 기반 교육자료 나눔 공간","siteTitle":"영일유치원 교육자료 나눔터","navFind":"자료 찾기","kicker":"AI·디지털 기반 교육자료 나눔 공간","heroA":"영일유치원","heroB":"교육자료 나눔터","heroText":"선생님들이 함께 만드는 놀이 중심 교육자료 공간입니다. 연령, 주제, 기기에 맞는 자료를 빠르게 찾아 수업과 놀이에 바로 활용해보세요.","browse":"자료 둘러보기","playOnView":"PLAY-ON 보기","searchPlaceholder":"자료명, 주제, 태그로 검색","sharedResources":"공유 자료","topics":"활용 주제","newResources":"새 자료","stageTitle":"놀이와 질문이 이어지는 흐름","stageText":"자료마다 표시된 PLAY-ON 단계로 수업 흐름에 맞는 활동을 고를 수 있습니다.","stageP":"그림책 만나기","stagePDesc":"그림책과 놀이로 새로운 세계를 만나요.","stageL":"질문하기","stageLDesc":"궁금한 점을 자유롭게 묻고 함께 이야기 나눠요.","stageA":"탐구하기","stageADesc":"AI·디지털 도구로 깊이 있게 탐구하고 표현해요.","stageY":"나누기","stageYDesc":"친구와 생각을 나누고 함께 성장해요.","libraryTitle":"교육자료 찾아보기","libraryText":"연령과 주제로 필터링하고, 필요한 자료를 바로 실행해보세요.","filterTitle":"자료 필터","age":"연령","topic":"주제","all":"전체","reset":"초기화","allResources":"전체 자료 보기","resultPrefix":"총 ","resultSuffix":"개의 자료가 보입니다.","noResultTitle":"조건에 맞는 자료가 없어요","noResultText":"검색어나 필터를 변경해보세요.","resetFilter":"필터 초기화","run":"실행하기","detail":"자세히","close":"닫기","modalAge":"대상 연령","modalType":"자료 유형","modalTopic":"활용 주제","modalDevice":"활용 기기","materials":"준비물","howToUse":"활용 방법","teacherTip":"교사용 팁","footerText":"아이들의 놀이와 배움이 이어지는 자료를 함께 나눕니다. 선생님들의 작은 자료가 모여 더 풍성한 배움이 됩니다.","copyright1":"© 영일유치원 교육자료 나눔터","copyright2":"본 자료는 교육적 활용을 목적으로 제작되었습니다.","copyright3":"상업적 사용 및 무단 배포를 금합니다."};
(function app() {
  const ageOrder = ['3\uC138', '4\uC138', '5\uC138', '\uD63C\uD569\uC5F0\uB839'];
  const topicOrder = ['\uADF8\uB9BC\uCC45', '\uC9C8\uBB38\uB180\uC774', '\uB514\uC9C0\uD138\uB180\uC774', '\uC0DD\uD0DC\uB180\uC774', '\uC5B8\uC5B4\uB180\uC774', '\uC2E0\uCCB4\uB180\uC774', '\uAC00\uAC8C\uB180\uC774'];
  const FILTERS = { age: [UI.all, ...ageOrder.filter(v => sampleResources.some(r => r.age === v))], topic: [UI.all, ...topicOrder.filter(v => sampleResources.some(r => r.topic === v))] };
  const STAGES = [{key:'P',name:UI.stageP,desc:UI.stagePDesc,color:'pink',icon:'P'},{key:'L',name:UI.stageL,desc:UI.stageLDesc,color:'yellow',icon:'L'},{key:'A',name:UI.stageA,desc:UI.stageADesc,color:'sky',icon:'A'},{key:'Y',name:UI.stageY,desc:UI.stageYDesc,color:'green',icon:'Y'}];
  const DEVICE_ICON = {};
  const state = { search:'', filters:{ age:UI.all, topic:UI.all } };
  const root = document.getElementById('root');
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  function stageFor(k){return STAGES.find(s=>s.key===k)}
  function cls(r){return (r.accent||'yellow')} function bg(r){return cls(r)+'Bg'} function dot(r){return cls(r)+'Dot'}
  function uniq(prop){return new Set(sampleResources.map(r=>r[prop]).filter(Boolean)).size}
  function newer(){return sampleResources.filter(r=>r.recentlyAdded).length}
  function stageHTML(s){return `<article class="stage"><div class="stageTop"><span class="stageKey ${s.color}Bg">${esc(s.key)}</span><span style="font-size:24px">${s.icon}</span></div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p></article>`}
  function filterHTML(key,label){return `<div class="filterGroup"><span class="filterLabel">${esc(label)}</span><div class="chips">${FILTERS[key].map(v=>`<button class="chip" type="button" data-filter="${key}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`}
  function build(){root.innerHTML=`<header class="header"><div class="container nav"><div class="brand"><span class="mark">Y</span><span>${UI.siteTitle}</span></div><div class="actions"><a class="btn secondary" href="#stages">PLAY-ON</a><a class="btn yellow" href="#library">${UI.navFind}</a></div></div></header><main><section class="hero"><div class="container heroGrid"><div><span class="kicker">? ${UI.kicker}</span><h1>${UI.heroA}<br>${UI.heroB}</h1><p>${UI.heroText}</p><div class="heroBtns"><a class="btn yellow" href="#library">${UI.browse}</a><a class="btn secondary" href="#stages">${UI.playOnView}</a></div></div><div class="panel"><label class="search" for="searchInput"><span>Search</span><input id="searchInput" type="search" autocomplete="off" placeholder="${UI.searchPlaceholder}"></label><div class="stats"><div class="stat"><strong>${sampleResources.length}</strong><span>${UI.sharedResources}</span></div><div class="stat"><strong>${uniq('topic')}</strong><span>${UI.topics}</span></div><div class="stat"><strong>${newer()}</strong><span>${UI.newResources}</span></div></div></div></div></section><section id="stages" class="section"><div class="container"><div class="title"><span class="label">PLAY-ON</span><h2>${UI.stageTitle}</h2><p>${UI.stageText}</p></div><div class="stageGrid">${STAGES.map(stageHTML).join('')}</div></div></section><section id="library" class="section"><div class="container"><div class="title"><span class="label">RESOURCE LIBRARY</span><h2>${UI.libraryTitle}</h2><p>${UI.libraryText}</p></div><div class="library"><aside class="filters"><h3>${UI.filterTitle}</h3><div id="activeChips" class="activeChips"></div>${filterHTML('age',UI.age)}${filterHTML('topic',UI.topic)}<button class="btn secondary" type="button" data-action="reset" style="width:100%;margin-top:10px">${UI.reset}</button></aside><div><div class="toolbar"><div id="count" class="count"></div><button class="btn secondary" type="button" data-action="reset">${UI.allResources}</button></div><div id="grid" class="grid"></div></div></div></div></section></main><footer class="footer"><div class="container footerGrid"><div><div class="brand"><span class="mark">Y</span><span>${UI.siteTitle}</span></div><p>${UI.footerText}</p></div><div class="copy">${UI.copyright1}<br>${UI.copyright2}<br>${UI.copyright3}</div></div></footer>`;bind();renderFilters();render()}
  function bind(){document.getElementById('searchInput').addEventListener('input',e=>{state.search=e.target.value.trim();render()});root.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){state.filters[f.dataset.filter]=f.dataset.value;renderFilters();render();return}const a=e.target.closest('[data-action]');if(!a)return;if(a.dataset.action==='reset')reset();if(a.dataset.action==='remove'){state.filters[a.dataset.key]=UI.all;renderFilters();render()}if(a.dataset.action==='detail')openModal(Number(a.dataset.id));if(a.dataset.action==='run')run(Number(a.dataset.id));if(a.dataset.action==='close')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})}
  function reset(){state.search='';state.filters.age=UI.all;state.filters.topic=UI.all;const i=document.getElementById('searchInput');if(i)i.value='';renderFilters();render()}
  function renderFilters(){Object.keys(FILTERS).forEach(k=>document.querySelectorAll(`[data-filter="${k}"]`).forEach(b=>b.classList.toggle('active',b.dataset.value===state.filters[k])));const active=Object.keys(state.filters).filter(k=>state.filters[k]!==UI.all);document.getElementById('activeChips').innerHTML=active.map(k=>`<button class="activeChip" type="button" data-action="remove" data-key="${k}">${k==='age'?UI.age:UI.topic}: ${esc(state.filters[k])} x</button>`).join('')}
  function filtered(){const kw=state.search.toLowerCase();return sampleResources.filter(r=>{if(state.filters.age!==UI.all&&r.age!==state.filters.age)return false;if(state.filters.topic!==UI.all&&r.topic!==state.filters.topic)return false;if(!kw)return true;return [r.title,r.description,r.longDescription,r.topic,r.age,r.type,...(r.tags||[])].join(' ').toLowerCase().includes(kw)})}
  function render(){const list=filtered();document.getElementById('count').textContent=UI.resultPrefix+list.length+UI.resultSuffix;const g=document.getElementById('grid');if(!list.length){g.innerHTML=`<div class="empty"><div style="font-size:38px">Search</div><h3>${UI.noResultTitle}</h3><p>${UI.noResultText}</p><button class="btn yellow" type="button" data-action="reset">${UI.resetFilter}</button></div>`;return}g.innerHTML=list.map(card).join('')}
  function card(r){const st=stageFor(r.playOnStage);const devices=(r.device||[]).slice(0,2).map(d=>`<span>${DEVICE_ICON[d]||'?'} ${esc(d)}</span>`).join('');const tags=(r.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join('');return `<article class="card"><div class="thumb ${bg(r)}"><span class="emoji">${esc(r.icon)}</span>${r.recentlyAdded?'<span class="badge new">? NEW</span>':''}${st?`<span class="badge stageBadge"><span class="${dot(r)}">?</span> ${esc(r.playOnStage)}</span>`:''}</div><div class="body"><h3>${esc(r.title)}</h3><p class="desc">${esc(r.description)}</p><div class="meta"><span>${esc(r.age)}</span><span>${esc(r.type)}</span>${devices}</div><div class="tags">${tags}</div><div class="cardBtns"><button class="btn" type="button" data-action="run" data-id="${r.id}">${UI.run}</button><button class="btn secondary" type="button" data-action="detail" data-id="${r.id}">${UI.detail}</button></div></div></article>`}
  function section(title,color,text){return `<section class="modalSection"><h3><span class="bar" style="background:${color}"></span>${esc(title)}</h3><p>${esc(text)}</p></section>`}
  function openModal(id){const r=sampleResources.find(x=>x.id===id);if(!r)return;const st=stageFor(r.playOnStage);closeModal();const m=document.createElement('div');m.id='modal';m.className='modalBg';m.dataset.action='close';m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="modalHead ${bg(r)}"><button class="close" type="button" data-action="close" aria-label="${UI.close}">?</button><div class="modalIcon">${esc(r.icon)}</div><div>${st?`<span class="badge stageBadge">PLAY-ON ? ${esc(r.playOnStage)} ${esc(st.name)}</span>`:''}<h2>${esc(r.title)}</h2></div></div><div class="modalBody"><p>${esc(r.longDescription)}</p><div class="modalMeta"><div><span>${UI.modalAge}</span><strong>${esc(r.age)}</strong></div><div><span>${UI.modalType}</span><strong>${esc(r.type)}</strong></div><div><span>${UI.modalTopic}</span><strong>${esc(r.topic)}</strong></div><div><span>${UI.modalDevice}</span><strong>${esc((r.device||[]).join(', '))}</strong></div></div>${section(UI.materials,'var(--yellow)',r.materials)}${section(UI.howToUse,'var(--green)',r.howToUse)}${section(UI.teacherTip,'var(--pink)',r.teacherTip)}<div class="tags" style="margin-top:20px">${(r.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join('')}</div></div><div class="modalFoot"><button class="btn secondary" type="button" data-action="close">${UI.close}</button><button class="btn" type="button" data-action="run" data-id="${r.id}">${UI.run}</button></div></div>`;document.body.appendChild(m)}
  function closeModal(){const m=document.getElementById('modal');if(m)m.remove()}
  function run(id){const r=sampleResources.find(x=>x.id===id);if(r&&r.link)window.open(r.link,'_blank','noopener')}
  build();
})();
</script>
