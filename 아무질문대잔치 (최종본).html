#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;gap:14px;padding:18px 18px 46px}

.panel{background:rgba(255,252,245,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:3px solid #fff;border-radius:var(--r);
  box-shadow:0 14px 30px rgba(158,116,84,.24),inset 0 2px 8px rgba(255,255,255,.9)}
.spill{background:rgba(255,253,248,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:3px solid #fff;border-radius:999px;box-shadow:0 6px 14px rgba(158,116,84,.2)}
.spill:active{transform:translateY(2px)}
.go{background:linear-gradient(180deg,var(--go1),var(--go2));border:4px solid #fff;
  box-shadow:0 6px 16px var(--go-sh),0 10px 20px rgba(190,130,80,.3);color:var(--go-tx)}
.go:active{transform:translateY(4px);box-shadow:0 2px 8px var(--go-sh)}

/* ── 상단 ── */
.top{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap}
.logo{font-size:clamp(23px,2.3vw,36px);line-height:1;letter-spacing:-.5px;color:#e08a6e;
  -webkit-text-stroke:7px #fffdf7;paint-order:stroke fill;padding:6px 20px;border-radius:999px;
  background:var(--cloud);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  filter:drop-shadow(0 4px 10px rgba(150,115,80,.18))}
.tbtn{display:flex;align-items:center;gap:9px;height:50px;padding:0 17px 0 8px}
.tbtn .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  box-shadow:inset 0 2px 6px rgba(255,255,255,.85)}
.tbtn span{font-size:clamp(15px,1.15vw,19px);white-space:nowrap}
.tbtn[disabled]{opacity:.45;pointer-events:none}
.undo{display:flex;align-items:center;gap:8px;height:44px;padding:0 15px 0 8px;font-size:15px;color:#7a5533}
.undo .ic{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#ffe0c2}
.round{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;padding:0}

/* ── 본문 ── */
.board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr) minmax(0,1fr);gap:16px}
.col{display:flex;flex-direction:column;min-height:0;border-radius:var(--r);overflow:hidden}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.head{flex:0 0 auto;display:flex;align-items:center;gap:13px;height:66px;padding:0 18px}
.head .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.85)}
.head h2{margin:0;font-size:clamp(20px,2vw,31px);font-weight:400}
.count{margin-left:auto;font-size:18px;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.85)}
.inside .head{background:linear-gradient(180deg,#ffe6ae,var(--in));color:var(--in-tx)}
.outside .head{background:linear-gradient(180deg,#d3ecfc,var(--out));color:var(--out-tx)}
.words .head{background:linear-gradient(180deg,var(--wd-lt),var(--wd));color:var(--wd-tx);height:60px}
.list{flex:1;min-height:0;padding:13px;display:flex;flex-direction:column;gap:10px;overflow:auto;scroll-behavior:smooth}
.empty{flex:1;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  border:4px dashed var(--line);border-radius:20px;background:var(--paper);text-align:center;
  font-size:clamp(18px,1.6vw,26px);color:#c4ad91;line-height:1.5;padding:16px}
.inside .empty{border-color:#f0d5b4}.outside .empty{border-color:#c9e3f7;background:#fbfdff;color:#9dbdd6}

/* 질문 카드 */
.q{border-radius:20px;padding:11px 15px;display:flex;flex-direction:column;gap:9px;animation:pop .32s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.inside .q{background:linear-gradient(180deg,var(--in-lt),var(--in-lt2));border:3px solid var(--in-bd);box-shadow:0 4px 12px var(--in-sh)}
.outside .q{background:linear-gradient(180deg,var(--out-lt),var(--out-lt2));border:3px solid var(--out-bd);box-shadow:0 4px 12px var(--out-sh)}
.qtop{display:flex;align-items:flex-start;gap:11px}
.num{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px solid #fff;font-size:20px}
.inside .num{background:#ffcf6b;color:#6b3d0c}.outside .num{background:#8fd0f5;color:#12405f}
.qtx{flex:1;font-size:calc(clamp(20px,1.85vw,28px) * var(--qs,1));line-height:1.32;word-break:break-word;white-space:pre-wrap;text-align:left}
.sq{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--paper);border:2px solid #ecd7b4}
.outside .sq{background:#fbfdff;border-color:var(--out-sh)}
.qrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.qrow.tools{display:none}                 /* 평소에는 질문만 보입니다 */
.q.on .qrow.tools{display:flex}
.q.picking .qrow.tools{display:none}
.q .sq{opacity:.42;transition:opacity .15s}
.q.on .sq{opacity:1}
.name{display:flex;align-items:center;gap:6px;padding:4px 13px 4px 9px;border-radius:999px;
  background:var(--nm);border:2px solid var(--nm-bd);font-size:clamp(14px,1.05vw,17px);color:var(--nm-tx)}
.name.blank{background:none;border:2px dashed #d3bb9c;color:#a98d6c;padding:5px 17px 5px 11px}
.mini{display:flex;align-items:center;gap:9px;padding:7px 16px 7px 12px;border-radius:13px;background:var(--paper);
  border:2px solid #ecd7b4;font-size:clamp(14px,1.28vw,20px)}
.outside .mini{background:#fbfdff;border-color:var(--out-sh)}
.mini:active,.name:active{transform:translateY(2px)}
.ans{display:flex;flex-direction:column;gap:7px}
.ans>div{display:flex;align-items:baseline;gap:10px;padding:7px 12px;border-radius:13px;background:var(--paper);border-left:4px solid var(--nm-bd)}
.outside .ans>div{background:#fbfdff}
.ans b{flex:0 0 auto;font-size:clamp(13px,1.1vw,17px);color:#7a5bb5;font-weight:400}
.ans span{font-size:calc(clamp(16px,1.4vw,21px) * var(--qs,1));line-height:1.34;word-break:break-word;white-space:pre-wrap}
.ans em{margin-left:auto;flex:0 0 auto;font-style:normal;opacity:.5;font-size:14px;cursor:pointer}

/* 이름 고르기 / 답변 패널 */
.pick{border-radius:14px;padding:9px;background:#f6eeff;border:2px solid var(--nm-bd);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.pick button{display:grid;place-items:center;min-height:44px;border-radius:11px;background:var(--nm);
  border:2px solid var(--nm-bd);font-size:16px;line-height:1.1;color:var(--nm-tx);white-space:nowrap}
.pick button.on{background:var(--nm-on);border:2px solid #fff;box-shadow:0 3px 9px rgba(138,99,196,.5);color:#fff}
.pick button:active{transform:translateY(2px)}
.pick .none{grid-column:1/-1;text-align:center;color:#8f7fa8;font-size:18px;padding:8px}
.apane{border-radius:16px;padding:12px;background:#f6eeff;border:3px solid var(--nm-bd);display:flex;flex-direction:column;gap:10px}
.apane textarea{width:100%;min-height:74px;resize:none;border-radius:13px;padding:11px 13px;background:#fff;
  border:2px solid var(--nm-bd);font-size:clamp(16px,1.45vw,22px);line-height:1.4}
.apane .row{display:flex;gap:9px}
.apane .row button{flex:1;min-height:54px;border-radius:14px;font-size:clamp(16px,1.4vw,21px)}
.btn-ok{background:linear-gradient(180deg,var(--go1),var(--go2));border:3px solid #fff;box-shadow:0 4px 12px var(--go-sh);color:var(--go-tx)}
.btn-no{background:#fff;border:3px solid var(--nm-bd);color:var(--nm-tx)}

/* 입력줄 */
.entry{flex:0 0 auto;padding:11px 14px 13px;border-top:2px solid var(--line-2);display:flex;gap:11px}
.entry input{flex:1;min-width:0;height:64px;padding:0 16px;border-radius:17px;background:var(--paper);
  border:3px solid var(--line);font-size:clamp(17px,1.5vw,24px)}
.entry input::placeholder{color:var(--ink-3)}
.entry input:focus{border-color:var(--go2);box-shadow:0 0 0 5px rgba(255,171,99,.22)}
.entry .add{flex:0 0 auto;display:grid;place-items:center;width:74px;height:64px;border-radius:17px}
.words .entry input{height:56px;border-radius:15px}
.words .entry .add{width:62px;height:56px;border-radius:15px;background:linear-gradient(180deg,var(--wd-lt),var(--wd));
  border:4px solid #fff;box-shadow:0 5px 14px #a8ce8e;color:var(--wd-tx)}
.words .entry .add:active{transform:translateY(3px);box-shadow:0 2px 8px #a8ce8e}

/* 그림책 · 단어 */
.book{flex:0 0 auto;height:clamp(180px,34vh,330px);padding:13px;display:flex;flex-direction:column;gap:9px}
.frame{flex:1;min-height:0;border-radius:18px;overflow:hidden;border:3px solid #ffe3c8;display:grid;place-items:center;background:var(--paper)}
.frame img{width:100%;height:100%;object-fit:contain}
.frame.drop{border-color:var(--go2);background:#fff6ea}
.chips{flex:1;min-height:0;padding:13px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 15px;border-radius:999px;font-size:clamp(16px,1.45vw,22px);
  border:2px solid;animation:pop .3s ease-out}
.chip i{font-style:normal;opacity:.45;cursor:pointer;font-size:15px}
.chip .cnt{font-weight:400;font-size:.82em;opacity:.72;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.75)}
.chip:nth-child(6n+1){background:#ffe3a8;border-color:#f0c877;box-shadow:0 3px 10px #edcf95}
.chip:nth-child(6n+2){background:#cfe9fb;border-color:#a2cdea;box-shadow:0 3px 10px #bcdcf2}
.chip:nth-child(6n+3){background:#ffd6de;border-color:#f0abb9;box-shadow:0 3px 10px #f4c3ce}
.chip:nth-child(6n+4){background:#d9f2c4;border-color:#adda8e;box-shadow:0 3px 10px #c6e6ae}
.chip:nth-child(6n+5){background:#e6dcff;border-color:#c2acef;box-shadow:0 3px 10px #d5c8f5}
.chip:nth-child(6n){background:#ffdcc2;border-color:#f0b98d;box-shadow:0 3px 10px #f5cbab}
.ghost{display:flex;align-items:center;gap:8px;align-self:flex-start;padding:7px 15px 7px 11px;border-radius:13px;
  border:3px dashed #d3bb9c;font-size:17px;color:#a98d6c;margin:0 14px 12px}

/* 덮개 */
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(120,90,60,.34);backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{width:min(1180px,96vw);max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:30px}
.sheet .head{height:auto;padding:16px 20px}
.sheet .head h2{font-size:clamp(22px,2.4vw,38px)}
.body{flex:1;min-height:0;overflow:auto;padding:22px}
.x{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.85)}
.rv{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.rv .col{border-radius:22px;border:3px solid #fff;background:rgba(255,255,255,.7);overflow:hidden}
.rv .list{overflow:visible}
.notyet{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:16px;padding:12px 16px;border-radius:18px;
  background:rgba(255,253,248,.72);border:3px solid #fff}
.notyet b{font-weight:400;font-size:17px;color:#9a7c5e}
.notyet span{font-size:17px;padding:4px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);color:#9a7c5e}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rec{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px;border-radius:20px;background:#fff;border:3px solid var(--line)}
.rec.now{border-color:var(--go2);box-shadow:0 0 0 4px rgba(255,171,99,.25)}
.rec .th{width:96px;height:112px;border-radius:14px;background:#fdf3e6;display:grid;place-items:center;overflow:hidden}
.rec .th img{width:100%;height:100%;object-fit:cover}
.rec h3{margin:0;font-size:20px;font-weight:400}
.rec p{margin:6px 0 10px;font-size:15px;color:var(--ink-2);line-height:1.5}
.rec .row{display:flex;gap:8px}
.rec .row button{padding:8px 14px;border-radius:12px;font-size:16px;border:2px solid var(--line);background:var(--paper)}
.rec .row .del{background:#fff0ef;border-color:#f0abb9;color:#96384c}
.ta{width:100%;min-height:150px;resize:vertical;border-radius:18px;padding:14px;background:#fff;
  border:3px solid var(--line);font-size:clamp(17px,1.5vw,22px);line-height:1.5}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.acts button{min-height:56px;padding:0 22px;border-radius:16px;font-size:clamp(16px,1.5vw,21px);
  background:var(--paper);border:3px solid var(--line)}
.acts .ok{background:linear-gradient(180deg,var(--go1),var(--go2));border-color:#fff;box-shadow:0 5px 14px var(--go-sh);color:var(--go-tx)}
.acts .danger{background:#fff0ef;border-color:#f0abb9;color:#96384c}
.menu{position:fixed;z-index:110;display:none;flex-direction:column;gap:4px;padding:10px;width:264px;
  border-radius:22px;background:#fffdf8;border:3px solid #fff;box-shadow:0 18px 40px rgba(158,116,84,.35)}
.menu.on{display:flex}
.menu button{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;font-size:19px;text-align:left}
.menu button:hover{background:#fdf1e2}
.menu hr{border:0;border-top:2px solid var(--line-2);margin:4px 2px}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:120;opacity:0;pointer-events:none;
  padding:13px 24px;border-radius:999px;background:#fffdf8;border:3px solid #fff;color:var(--ink);
  box-shadow:0 12px 28px rgba(158,116,84,.35);font-size:20px;transition:.22s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ── 우리 반 책장 ── */
#shelf{position:fixed;inset:0;z-index:78;display:none;flex-direction:column;padding:20px 26px 18px}
#shelf.on{display:flex}
.shtop{flex:0 0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:80px}
.shtitle{margin:0;font-weight:400;font-size:clamp(26px,3.2vw,46px);line-height:1;color:#e08a6e;
  -webkit-text-stroke:8px #fffdf7;paint-order:stroke fill;padding:6px 22px;border-radius:999px;
  background:var(--cloud);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  filter:drop-shadow(0 4px 10px rgba(150,115,80,.18))}
.shbody{flex:1;min-height:0;overflow:auto;padding-top:10px}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:0 0;padding-bottom:10px}
.cell{position:relative;padding:16px 13px 44px;display:flex;flex-direction:column;align-items:center;gap:11px;cursor:pointer}
.cell::after{content:"";position:absolute;left:-1px;right:-1px;bottom:10px;height:17px;border-radius:5px;
  background:linear-gradient(180deg,#efdcc0,#dcbe99);box-shadow:0 7px 14px rgba(160,120,80,.22)}
.cv{position:relative;height:var(--cvh,240px);width:var(--cvw,180px);max-width:100%;border-radius:14px;overflow:hidden;background:#fffdf8;
  border:6px solid #fff;box-shadow:0 9px 22px rgba(170,125,85,.32),0 14px 24px rgba(150,110,80,.26);
  display:grid;place-items:center;transition:transform .12s}
.cv img{width:100%;height:100%;object-fit:contain;background:#fdfaf2}
.cell:active .cv{transform:translateY(5px)}
.cvnone{display:flex;flex-direction:column;align-items:center;gap:10px;color:#c9a882;font-size:17px;padding:12px;text-align:center}
.cname{width:100%;height:var(--nameh,72px);display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:21px;line-height:1.26;word-break:keep-all;overflow-wrap:anywhere;overflow:hidden}
.cmeta{font-size:15px;color:#9a7c5e}
.badge{position:absolute;top:8px;right:8px;padding:5px 13px;border-radius:999px;background:#ff8a3d;
  border:4px solid #fffdf8;color:#fff;font-size:15px;box-shadow:0 3px 10px rgba(160,90,30,.4)}
.cdel{position:absolute;top:8px;left:8px;display:none;place-items:center;width:40px;height:40px;border-radius:50%;
  background:#fff;border:4px solid #f0abb9;color:#96384c;box-shadow:0 3px 10px rgba(180,110,125,.35)}
.cell.newb .cv{border-style:dashed;border-color:#e0b183;background:rgba(255,253,248,.72)}
.cell.newb .cvnone{color:#b8894f;font-size:20px}
#shelf.tidy .cdel{display:grid}
.cell.slot{cursor:default}
.cell.slot .cv{border:0;background:none;box-shadow:none}
.cell.slot .cname,.cell.slot .cmeta{opacity:0}
/* 책장 위 세 단추 — 크기는 같게, 색만 첫 화면 그림의 파스텔로 다르게 */
.shbtn{display:flex;align-items:center;gap:10px;height:66px;padding:0 24px;border-radius:999px;
  font-size:20px;border:4px solid #fffdf8;box-shadow:0 6px 14px rgba(150,120,85,.2)}
.shbtn:active{transform:translateY(3px);box-shadow:0 3px 8px rgba(150,120,85,.2)}
.shbtn.b1{background:linear-gradient(180deg,#fdeac2,#f8d79b);color:#7a5a2b}   /* 햇살 */
.shbtn.b2{background:linear-gradient(180deg,#e8f2d9,#d3e5b8);color:#4f6733}   /* 풀빛 */
.shbtn.b3{background:linear-gradient(180deg,#eee7f8,#ddd2f1);color:#5d4a7a}   /* 들꽃 */
#shelf.tidy .shbtn.b2{background:linear-gradient(180deg,#fbd9c4,#f3bd9b);color:#7a4527}
@media(max-width:960px){
  .shtop{gap:10px;min-height:70px}
  .shbtn{height:60px;padding:0 16px;font-size:18px;gap:8px;border-width:3px}
}
.shempty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 20px;
  font-size:24px;color:#a3886a;text-align:center;line-height:1.5}

/* ── 표지 ── */
#cover{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding:24px 24px clamp(16px,3vh,40px);text-align:center;overflow:hidden;background:#eef2e6}

.cvui{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,16px)}
/* 그림의 햇살·풀빛에서 고른 크림 젤리 버튼 */
.jelly{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;
  min-height:clamp(74px,10.5vh,104px);padding:0 clamp(32px,3.8vw,58px);border-radius:999px;
  font-size:clamp(23px,2.8vw,40px);color:#7a5a38;letter-spacing:-.5px;
  background:linear-gradient(180deg,#fffaea 0%,#fdf0cd 48%,#f6e2ad 100%);
  border:7px solid rgba(255,255,255,.96);
  box-shadow:0 12px 26px rgba(120,118,72,.3),0 4px 0 rgba(255,255,255,.85) inset,0 -8px 16px rgba(223,201,144,.5) inset;
  animation:bump .55s .2s cubic-bezier(.2,1.5,.5,1) both}
.jelly::after{content:"";position:absolute;left:12%;right:12%;top:8px;height:32%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
@keyframes bump{from{transform:scale(.84);opacity:0}to{transform:none;opacity:1}}
.jelly:active{transform:translateY(4px) scale(.985);
  box-shadow:0 6px 14px rgba(120,118,72,.26),0 -7px 14px rgba(223,201,144,.5) inset}
.hid{display:none!important}

@media(max-width:1100px){
  html,body{overflow:auto}
  #app{height:auto;min-height:100dvh;padding:14px 14px 30px}
  .board{grid-template-columns:1fr}
  .col,.side{min-height:0}
  .book{height:260px}
  .list{max-height:none;overflow:visible}
  .chips{min-height:120px}
}
</style>
</head>
<body>

<div id="scene" aria-hidden="true"></div>

<div id="app">
  <header class="top">
    <h1 class="logo" style="margin:0;font-weight:400">아무질문 대잔치</h1>
    <button id="bShelf" class="spill undo"><span class="ic" data-i="recs"></span><span>책장</span></button>
      <button id="bUndo" class="spill undo hid"><span class="ic" data-i="undo"></span><span>되돌리기</span></button>
    <div style="flex:1"></div>

    <button id="bReview" class="spill tbtn"><span class="ic" data-i="grid" style="background:linear-gradient(180deg,#cfe9fb,#9dcef1)"></span><span>모아보기</span></button>
    <button id="bPng" class="go tbtn" style="border-radius:999px;padding:0 26px 0 11px"><span class="ic" data-i="imgsave" style="background:rgba(255,255,255,.78)"></span><span>저장</span></button>
    <button id="bMenu" class="spill round" data-i="dots"></button>
  </header>

  <main class="board">
    <div class="side">
      <section class="panel book">
        <div id="frame" class="frame" tabindex="0" role="button" aria-label="그림책 사진"></div>
      </section>
      <section class="panel col words">
        <div class="head"><span class="ic" data-i="word"></span><h2>떠오른 단어</h2><span id="cWord" class="count">0</span></div>
        <div id="wordBox" class="chips"></div>
        <div class="entry">
          <input id="wordIn" maxlength="30" placeholder="떠오른 단어" autocomplete="off">
          <button id="wordAdd" class="add" data-i="plus" aria-label="단어 더하기"></button>
        </div>
      </section>
    </div>

    <section class="panel col inside">
      <div class="head"><span class="ic" data-i="book"></span><h2>책 속 질문</h2><span id="cIn" class="count">0</span></div>
      <div id="listIn" class="list"></div>
      <div class="entry">
        <input id="inIn" maxlength="120" placeholder="책에서 궁금한 것" autocomplete="off">
        <button id="addIn" class="go add" data-i="plus" aria-label="책 속 질문 더하기"></button>
      </div>
      <button id="rosterA" class="ghost"><span data-i="person"></span>학급 명단 넣기</button>
    </section>

    <section class="panel col outside">
      <div class="head"><span class="ic" data-i="bubble"></span><h2>책 밖 질문</h2><span id="cOut" class="count">0</span></div>
      <div id="listOut" class="list"></div>
      <div class="entry">
        <input id="inOut" maxlength="120" placeholder="생각을 넓힌 것" autocomplete="off">
        <button id="addOut" class="go add" data-i="plus" aria-label="책 밖 질문 더하기"></button>
      </div>
      <button id="rosterB" class="ghost"><span data-i="person"></span>학급 명단 넣기</button>
    </section>
  </main>
</div>

<div id="shelf">
  <div class="shtop">
    <h2 class="shtitle">우리 반 책장</h2>
    <div style="flex:1"></div>
    <button id="shNew" class="shbtn b1"><span data-i="plus" data-sz="24" style="display:grid"></span>새 그림책</button>
    <button id="shTidy" class="shbtn b2"><span data-i="trash" data-sz="24" style="display:grid"></span>정리</button>
    <button id="shRoster" class="shbtn b3"><span data-i="person" data-sz="24" style="display:grid"></span>학급 명단</button>
  </div>
  <div class="shbody"><div id="shGrid" class="shgrid"></div></div>
</div>

<div id="cover">
  <div id="coverArt" aria-hidden="true"></div>
  <div class="cvui">
    <button id="coverGo" class="jelly"><span data-i="seed" data-sz="40" style="display:grid"></span><span id="coverTx">질문 놀이 시작</span></button>
  </div>
</div>
<div id="menu" class="menu"></div>
<div id="toast"></div>
<input id="file" type="file" accept="image/*" class="hid">


<div id="ovReview" class="ov"><div class="panel sheet">
  <div class="head" style="background:linear-gradient(180deg,#ffe6ae,#ffce78);color:#7a4a18">
    <span class="ic" data-i="grid"></span><h2>오늘의 질문 판</h2>
    <div style="margin-left:auto;display:flex;gap:10px">
      <button id="rvPng" class="go" style="border-radius:16px;padding:0 20px;min-height:54px;font-size:19px">그림으로 저장</button>
      <button id="rvTxt" class="x" style="width:auto;padding:0 18px;font-size:19px">글자로 저장</button>
      <button class="x" data-close data-i="x"></button>
    </div>
  </div>
  <div class="body"><div id="rvBox" class="rv"></div><div id="rvChips" style="margin-top:16px"></div><div id="rvNot" class="notyet hid"></div></div>
</div></div>

<div id="ovRecs" class="ov"><div class="panel sheet">
  <div class="head" style="background:linear-gradient(180deg,#ffe6ae,#ffce78);color:#7a4a18">
    <span class="ic" data-i="recs"></span><h2>누적 기록</h2>
    <button class="x" data-close data-i="x" style="margin-left:auto"></button>
  </div>
  <div class="body"><div id="recBox" class="recs"></div></div>
</div></div>

<div id="ovRoster" class="ov"><div class="panel sheet" style="width:min(760px,96vw)">
  <div class="head" style="background:linear-gradient(180deg,#ece0ff,#c8b0ef);color:#543a80">
    <span class="ic" data-i="person"></span><h2>학급 명단</h2>
    <button class="x" data-close data-i="x" style="margin-left:auto"></button>
  </div>
  <div class="body">
    <p style="margin:0 0 12px;font-size:18px;color:#8a6a48;line-height:1.6">쉼표나 줄바꿈으로 이름을 나눠 적어 주세요. 적은 순서 그대로 화면에 놓입니다.<br>한 번 넣으면 다음부터 자동으로 불러옵니다.</p>
    <textarea id="rosterTa" class="ta" placeholder="김유찬, 이서윤, 박승빈, 최하준"></textarea>
    <div id="rosterPv" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px"></div>
    <div class="acts">
      <button data-close>취소</button>
      <button id="rosterClr" class="danger">비우기</button>
      <button id="rosterSave" class="ok">저장</button>
    </div>
  </div>
</div></div>

<div id="ovText" class="ov"><div class="panel sheet" style="width:min(620px,94vw)">
  <div class="body">
    <h2 id="txT" style="margin:0 0 12px;font-size:27px;font-weight:400"></h2>
    <input id="txIn" class="ta" style="min-height:0;height:70px" maxlength="120">
    <div class="acts"><button data-close>취소</button><button id="txOk" class="ok">저장</button></div>
  </div>
</div></div>

<div id="ovAsk" class="ov"><div class="panel sheet" style="width:min(560px,94vw)">
  <div class="body">
    <h2 id="askT" style="margin:0 0 10px;font-size:28px;font-weight:400"></h2>
    <p id="askB" style="margin:0;font-size:19px;color:#8a6a48;line-height:1.6;white-space:pre-wrap"></p>
    <div class="acts"><button data-close>그만두기</button><button id="askOk" class="danger">네, 할게요</button></div>
  </div>
</div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ── 아이콘 (전부 직접 그린 인라인 SVG · 이모지 0개) ── */
const P={
 book:'<path d="M12 6.5C10 4.8 7.5 4.3 4.5 4.6v13c3-.3 5.5.2 7.5 1.9 2-1.7 4.5-2.2 7.5-1.9v-13c-3-.3-5.5.2-7.5 1.9Z"/><path d="M12 6.5v12.9"/>',
 bubble:'<path d="M20 12.2c0 3.8-3.6 6.9-8 6.9-.9 0-1.7-.1-2.5-.3L5 20.8l1.1-3.2C4.8 16.3 4 14.4 4 12.2c0-3.8 3.6-6.9 8-6.9s8 3.1 8 6.9Z"/>',
 word:'<rect x="3.5" y="6.5" width="17" height="11" rx="3.4"/><path d="M7.6 12h5.6"/><path d="M16 10v4"/>',
 person:'<circle cx="12" cy="9" r="3.2"/><path d="M5.5 19.5c.8-3.3 3.4-5 6.5-5s5.7 1.7 6.5 5"/>',
 answer:'<path d="M14.5 4.5H5a1.9 1.9 0 0 0-1.9 1.9v5.3A1.9 1.9 0 0 0 5 13.6h1.3v3.1l3.1-3.1h5.1a1.9 1.9 0 0 0 1.9-1.9V6.4a1.9 1.9 0 0 0-1.9-1.9Z"/><path d="M19 9.4h.4a1.6 1.6 0 0 1 1.6 1.6v4.4a1.6 1.6 0 0 1-1.6 1.6h-.9l-2.6 2.6v-2.6"/>',
 seed:'<path d="M12 20.5v-7.6"/><path d="M12 12.9C12 9.4 9.5 7.4 6 7.4c0 3.5 2.5 5.5 6 5.5Z"/><path d="M12 12.9c0-3.1 2.2-4.9 5.3-4.9 0 3.1-2.2 4.9-5.3 4.9Z"/>',
 speak:'<path d="M11 6.5 6.8 10H4v4h2.8L11 17.5v-11Z"/><path d="M14.6 9.3a4 4 0 0 1 0 5.4"/><path d="M17.4 6.8a8 8 0 0 1 0 10.4"/>',
 imgsave:'<rect x="3.5" y="4" width="17" height="11.5" rx="3"/><path d="M6.8 12.8 10 9.6l2.6 2.3"/><path d="M12 18.5v3.2m0 0-2-2m2 2 2-2"/>',
 txtsave:'<path d="M6.5 3h7L17.5 7v8a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M8.2 9.5h6M8.2 12.8h4"/><path d="M12 19.3v3.2m0 0-2-2m2 2 2-2"/>',
 photo:'<path d="M4.5 8.5h3l1.5-2h6l1.5 2h3v9h-15v-9Z"/><circle cx="12" cy="13" r="2.8"/>',
 recs:'<rect x="3.8" y="5" width="4.4" height="14" rx="1.6"/><rect x="9.8" y="5" width="4.4" height="14" rx="1.6"/><rect x="15.8" y="5" width="4.4" height="14" rx="1.6"/>',
 grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
 pencil:'<path d="M16.4 4.4 19.6 7.6l-10 10-4.2 1 1-4.2 10-10Z"/><path d="M14.3 6.5 17.5 9.7"/>',
 trash:'<path d="M4.8 7.4h14.4"/><path d="M9.6 7.4V5.2h4.8v2.2"/><path d="M6.8 7.4l.9 11.2a1.6 1.6 0 0 0 1.6 1.5h5.4a1.6 1.6 0 0 0 1.6-1.5l.9-11.2"/>',
 undo:'<path d="M5.5 9.5h8a5 5 0 0 1 0 10H9"/><path d="M9 5.5 5 9.5l4 4"/>',
 plus:'<path d="M12 5.5v13M5.5 12h13"/>',
 x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
 swap:'<path d="M4 8.5h13M13.5 5 17 8.5 13.5 12"/><path d="M20 15.5H7M10.5 12 7 15.5 10.5 19"/>',
 broom:'<path d="M14.5 4.5 9 10"/><path d="M12.5 8.5 16 12l-5 7H6l1.5-7Z"/>',
 dots:'<circle cx="6" cy="12" r="1.9" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.9" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.9" fill="currentColor" stroke="none"/>'
};
function svg(n,sz){return '<svg width="'+(sz||24)+'" height="'+(sz||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[n]||'')+'</svg>'}
function paint(root){(root||document).querySelectorAll('[data-i]').forEach(e=>{if(!e.dataset.done){e.innerHTML=svg(e.dataset.i,e.dataset.sz||24);e.dataset.done=1}})}

/* ── 저장소 ── */
const KEY='any-question-festival-v6', RKEY='any-question-festival-roster-v1', OLD=['any-question-festival-v5','any-question-festival-v4'];
const IDB='aqf-img';
let idbP=null;
function db(){ if(idbP) return idbP;
  idbP=new Promise((res,rej)=>{ try{const r=indexedDB.open(IDB,1);
    r.onupgradeneeded=()=>{try{r.result.createObjectStore('img')}catch(e){}};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e)} });
  return idbP.catch(()=>null);
}
async function imgPut(k,v){const d=await db();if(!d)return false;return new Promise(r=>{try{const t=d.transaction('img','readwrite');t.objectStore('img').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}})}
async function imgGet(k){const d=await db();if(!d)return '';return new Promise(r=>{try{const t=d.transaction('img','readonly');const q=t.objectStore('img').get(k);q.onsuccess=()=>r(q.result||'');q.onerror=()=>r('')}catch(e){r('')}})}
async function imgDel(k){const d=await db();if(!d)return;try{const t=d.transaction('img','readwrite');t.objectStore('img').delete(k)}catch(e){}}

/* ── 자료 구조 (옛 판본도 그대로 읽힘) ── */
const uid=()=>Date.now().toString(36)+Math.random().toString(16).slice(2,8);
const now=()=>new Date().toISOString();
const clone=v=>JSON.parse(JSON.stringify(v));
function nAns(a){ if(typeof a==='string') return {id:uid(),text:a,answerer:''};
  return {id:a&&a.id||uid(),text:String(a&&(a.text??a.answer)||''),answerer:String(a&&(a.answerer??a.name)||'')}}
function nQ(q){ const raw=Array.isArray(q&&q.answers)?q.answers:(q&&q.answer?[q.answer]:[]);
  return {id:q&&q.id||uid(),text:String(q&&(q.text??q.question)||''),questioner:String(q&&(q.questioner??q.name)||''),
    answers:raw.map(nAns).filter(a=>a.text.trim())}}
function nW(w){ if(typeof w==='string') return {id:uid(),text:w,n:1};
  return {id:w&&w.id||uid(),text:String(w&&w.text||''),n:Math.max(1,parseInt(w&&w.n,10)||1)}}
function mergeWords(ws){ const out=[],at={};
  ws.forEach(w=>{ const k=w.text.trim(); if(!k) return;
    if(at[k]!==undefined){ out[at[k]].n+=w.n } else { at[k]=out.length; out.push(w) } });
  return out }
function nRec(r){ r=r||{}; return {id:r.id||uid(),title:String(r.title||''),image:typeof r.image==='string'?r.image:'',
  inside:Array.isArray(r.inside)?r.inside.map(nQ):[], outside:Array.isArray(r.outside)?r.outside.map(nQ):[],
  words:mergeWords(Array.isArray(r.words)?r.words.map(nW).filter(w=>w.text.trim()):[]),
  createdAt:r.createdAt||r.updatedAt||now(), updatedAt:r.updatedAt||r.createdAt||now()}}
const newRec=()=>nRec({});
const has=r=>!!(r.image||r.inside.length||r.outside.length||r.words.length);
const nQs=r=>r.inside.length+r.outside.length;
const nAs=r=>[...r.inside,...r.outside].reduce((n,q)=>n+q.answers.length,0);

let records=[], cur=newRec(), roster=[], imgCache={}, undoS=[], pick=null, apane=null, tools=null, askFn=null;

function parseNames(t){const out=[],seen={};String(t||'').split(/[,，\n]/).forEach(s=>{s=s.trim();if(s&&!seen[s]){seen[s]=1;out.push(s)}});return out}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){try{return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric'}).format(new Date(v))}catch(e){return ''}}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())}

let tT=null;
function toast(m){clearTimeout(tT);const t=$('#toast');t.textContent=m;t.classList.add('on');tT=setTimeout(()=>t.classList.remove('on'),2100)}

function saveRoster(){try{localStorage.setItem(RKEY,JSON.stringify(roster))}catch(e){toast('명단을 저장하지 못했어요.')}}
function persist(){
  cur.updatedAt=now();
  const i=records.findIndex(r=>r.id===cur.id);
  if(has(cur)){ const c=clone(cur); if(i>=0) records[i]=c; else records.push(c); }
  else if(i>=0) records.splice(i,1);
  try{ localStorage.setItem(KEY,JSON.stringify({currentId:cur.id,records})) }
  catch(e){ toast('저장 공간이 부족해요. 누적 기록에서 오래된 것을 지워 주세요.') }
}
async function load(){
  try{ const raw=localStorage.getItem(RKEY); roster=raw?parseNames(JSON.parse(raw).join(',')):[] }catch(e){ roster=[] }
  let p=null;
  try{ const raw=localStorage.getItem(KEY); if(raw) p=JSON.parse(raw); }catch(e){}
  if(!p){ for(const k of OLD){ try{ const o=localStorage.getItem(k); if(!o) continue; const v=JSON.parse(o);
      p = Array.isArray(v&&v.records)? v : {currentId:null,records:[v]}; break }catch(e){} } }
  if(p){ records=(Array.isArray(p.records)?p.records:[]).map(nRec);
    cur=clone(records.find(r=>r.id===p.currentId)||records[records.length-1]||newRec()); }
  // 옛 판본: 사진이 본문에 박혀 있으면 따로 옮김
  for(const r of records){ if(r.image && r.image.length>200){ const ok=await imgPut(r.id,r.image); if(ok){ imgCache[r.id]=r.image; r.image='y' } } }
  if(cur.image && cur.image.length>200){ imgCache[cur.id]=cur.image; await imgPut(cur.id,cur.image); cur.image='y' }
  if(cur.image==='y' && !imgCache[cur.id]) imgCache[cur.id]=await imgGet(cur.id);
  persist();
}

/* ── 되돌리기 ── */
function mark(){ undoS.push(clone(cur)); if(undoS.length>30) undoS.shift(); $('#bUndo').classList.remove('hid') }
function undo(){ const s=undoS.pop(); if(!s){toast('되돌릴 것이 없어요.');return}
  cur=s; if(!undoS.length) $('#bUndo').classList.add('hid');
  pick=null; apane=null; persist(); render(); toast('되돌렸어요.') }

/* ── 그리기 ── */
function nameChip(n,cls){ return '<button class="name '+(n?'':'blank')+(cls||'')+'">'+svg('person',19)+(n?esc(n):'이름')+'</button>' }

function cardHTML(q,i,type){
  const open = pick && pick.id===q.id, ap = apane && apane.id===q.id;
  const on = open || ap || tools===q.id;            /* 도구 줄이 보이는 상태 */
  let h='<article class="q'+(on?' on':'')+(open?' picking':'')+'" data-id="'+q.id+'" data-type="'+type+'">';
  h+='<div class="qtop"><span class="num">'+(i+1)+'</span><div class="qtx">'+esc(q.text)+'</div></div>';
  /* 이름은 '내용'이라 늘 보입니다. 눌러서 바꿀 수 있습니다. */
  if(q.questioner) h+='<div class="qrow keep">'+nameChip(q.questioner).replace('<button','<button data-act="pick"')+'</div>';
  h+='<div class="qrow tools">'
    +(q.questioner?'':nameChip('').replace('<button','<button data-act="pick"'))
    +'<button class="mini" data-act="answer">'+svg('answer',20)+'친구 생각 듣기</button>'
    +'<button class="mini" data-act="move" title="반대쪽으로">'+svg('swap',20)+(type==='inside'?'책 밖으로':'책 속으로')+'</button>'
    +'<button class="mini" data-act="edit" aria-label="고치기">'+svg('pencil',20)+'</button>'
    +'<button class="mini" data-act="del" aria-label="지우기">'+svg('trash',20)+'</button></div>';
  if(open) h+=pickHTML(q.questioner);
  if(q.answers.length){ h+='<div class="ans">'+q.answers.map(a=>
      '<div data-aid="'+a.id+'"><b>'+esc(a.answerer||'친구')+'</b><span>'+esc(a.text)+'</span><em data-act="delans">'+svg('trash',17)+'</em></div>').join('')+'</div>' }
  if(ap) h+=apaneHTML();
  return h+'</article>';
}

function pickHTML(sel){
  if(!roster.length) return '<div class="pick"><div class="none">먼저 학급 명단을 넣어 주세요.</div></div>';
  return '<div class="pick">'+roster.map(n=>'<button data-name="'+esc(n)+'" class="'+(n===sel?'on':'')+'">'+esc(n)+'</button>').join('')
    +(sel?'<button data-name="" class="none" style="min-height:auto">이름 지우기</button>':'')+'</div>';
}
function apaneHTML(){
  const w=apane.who;
  const nameBtn = roster.length
    ? '<button class="name '+(w?'':'blank')+'" data-act="apick">'+svg('person',19)+(w?esc(w):'누가 말했나요')+'</button>'
    : '';
  return '<div class="apane"><textarea id="ansTa" placeholder="친구가 말한 것을 적어요" maxlength="200">'+esc(apane.text||'')+'</textarea>'
    + (nameBtn?'<div class="qrow">'+nameBtn+'</div>':'')
    + (apane.open?'<div class="pick">'+roster.map(n=>'<button data-who="'+esc(n)+'" class="'+(n===w?'on':'')+'">'+esc(n)+'</button>').join('')
        +(w?'<button data-who="" class="none" style="min-height:auto">이름 지우기</button>':'')+'</div>':'')
    + '<div class="row"><button class="btn-no" data-act="acancel">닫기</button><button class="btn-ok" data-act="asave">등록</button></div></div>';
}
let shortMap={};
function short(n){ return shortMap[n]||n }
function buildShort(){
  shortMap={}; const two={};
  roster.forEach(n=>{ const s=n.length>=3?n.slice(1):n; two[s]=(two[s]||0)+1 });
  roster.forEach(n=>{ const s=n.length>=3?n.slice(1):n; shortMap[n]= two[s]===1? s : n });
}

function renderList(type){
  const box = type==='inside'?$('#listIn'):$('#listOut'), items=cur[type];
  if(!items.length){ box.innerHTML='<div class="empty">'+svg(type==='inside'?'book':'bubble',78)
    +'<div>'+(type==='inside'?'아이 말을 듣고<br>아래에 적어요':'책에서 생각을 넓힌<br>질문을 적어요')+'</div></div>'; return }
  box.innerHTML=items.map((q,i)=>cardHTML(q,i,type)).join('');
}
function renderWords(){
  const b=$('#wordBox');
  if(!cur.words.length){ b.innerHTML='<div class="empty" style="border-color:#d5ecc2;background:#fcfff9;color:#a3c08f">한 낱말도 좋아요</div>'; return }
  b.innerHTML=cur.words.map(w=>'<span class="chip">'+esc(w.text)
    +((w.n||1)>1?'<b class="cnt">×'+w.n+'</b>':'')
    +'<i data-wid="'+w.id+'" role="button" aria-label="지우기">'+svg('x',15)+'</i></span>').join('');
}
function renderBook(){
  const f=$('#frame'), src=imgCache[cur.id]||'';
  if(src){ f.innerHTML='<img src="'+src+'" alt="그림책">' }
  else { f.innerHTML='<div class="empty" style="border:0;background:none">'+svg('photo',76)
      +'<div>그림책 사진<br><span style="font-size:.7em">나중에 넣어도 돼요</span></div></div>' }
}
function render(){
  /* 질문이 적을수록 글자를 크게 — 뒤에 앉은 아이도 읽을 수 있게 */
  const nq=Math.max(cur.inside.length,cur.outside.length);
  document.documentElement.style.setProperty('--qs', nq<=1?1.34:nq<=2?1.26:nq<=3?1.16:nq<=4?1.08:1);
  buildShort();
  renderList('inside'); renderList('outside'); renderWords(); renderBook();
  $('#cIn').textContent=cur.inside.length; $('#cOut').textContent=cur.outside.length; $('#cWord').textContent=cur.words.length;
  const hasR=roster.length>0;
  $('#rosterA').classList.toggle('hid',hasR); $('#rosterB').classList.toggle('hid',hasR);
  $('#bReview').disabled = !nQs(cur) && !cur.words.length;
  $('#bPng').disabled = !nQs(cur) && !cur.words.length;
  paint();
  if(apane){ const ta=$('#ansTa'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length) } }
}

/* ── 동작 ── */
function addQ(type){
  const inp = type==='inside'?$('#inIn'):$('#inOut'), t=inp.value.trim();
  if(!t){ inp.focus(); return }
  const nid=uid();
  mark(); cur[type].push({id:nid,text:t,questioner:'',answers:[]});
  inp.value=''; apane=null;
  /* 명단이 있으면 '누가 말했는지'를 바로 고르도록 펼쳐 둡니다. 안 고르고 다음 질문을 적어도 됩니다. */
  pick = roster.length?{id:nid}:null; tools = roster.length?nid:null;
  persist(); render();
  const box=type==='inside'?$('#listIn'):$('#listOut'); box.scrollTop=box.scrollHeight; inp.focus();
}
function addWord(){ const i=$('#wordIn'), t=i.value.trim(); if(!t){i.focus();return}
  mark();
  const same=cur.words.find(w=>w.text.trim()===t);
  if(same){ same.n=(same.n||1)+1; toast('같은 낱말이에요 — ‘'+t+'’ ×'+same.n) }
  else cur.words.push({id:uid(),text:t,n:1});
  i.value=''; persist(); render(); i.focus() }


function find(type,id){ return cur[type].find(q=>q.id===id) }

$('#listIn').addEventListener('click',onCard); $('#listOut').addEventListener('click',onCard);
function onCard(e){
  const card=e.target.closest('.q'); if(!card) return;
  const type=card.dataset.type, id=card.dataset.id, q=find(type,id); if(!q) return;
  const nb=e.target.closest('[data-name]');
  if(nb){ mark(); q.questioner=nb.dataset.name; pick=null; tools=null; persist(); render(); return }
  const wb=e.target.closest('[data-who]');
  if(wb){ apane.who=wb.dataset.who; apane.text=($('#ansTa')||{}).value||apane.text; apane.open=false; render(); return }
  const b=e.target.closest('[data-act]');
  if(!b){ tools=(tools===id)?null:id; pick=null; render(); return }   /* 질문을 누르면 도구가 나옵니다 */
  const act=b.dataset.act;
  if(act==='pick'){ pick = (pick&&pick.id===id)?null:{id:id}; apane=null; tools=id; render() }
  else if(act==='answer'){ apane = (apane&&apane.id===id)?null:{id:id,type:type,who:'',text:'',open:false}; pick=null; tools=id; render() }
  else if(act==='apick'){ apane.text=($('#ansTa')||{}).value||apane.text; apane.open=!apane.open; render() }
  else if(act==='acancel'){ apane=null; tools=null; render() }
  else if(act==='asave'){
    const t=($('#ansTa')||{}).value||''; if(!t.trim()){ $('#ansTa').focus(); return }
    mark(); q.answers.push({id:uid(),text:t.trim(),answerer:apane.who||''});
    apane={id:id,type:type,who:'',text:'',open:false}; persist(); render(); toast('친구 생각을 담았어요.');
  }
  else if(act==='delans'){ const aid=e.target.closest('[data-aid]').dataset.aid;
    mark(); q.answers=q.answers.filter(a=>a.id!==aid); persist(); render(); toast('지웠어요. 되돌릴 수 있어요.') }
  else if(act==='move'){ const to=type==='inside'?'outside':'inside';
    mark(); cur[type]=cur[type].filter(x=>x.id!==id); cur[to].push(q); pick=null; apane=null; persist(); render();
    toast(to==='inside'?'책 속으로 옮겼어요.':'책 밖으로 옮겼어요.') }
  else if(act==='del'){ mark(); cur[type]=cur[type].filter(x=>x.id!==id); pick=null; apane=null; persist(); render();
    toast('지웠어요. 되돌릴 수 있어요.') }
  else if(act==='edit'){
    askText('질문 고치기',q.text,v=>{ if(!v) return; mark(); q.text=v; persist(); render() });
  }
}
$('#wordBox').addEventListener('click',e=>{ const i=e.target.closest('[data-wid]'); if(!i) return;
  mark(); cur.words=cur.words.filter(w=>w.id!==i.dataset.wid); persist(); render(); toast('지웠어요. 되돌릴 수 있어요.') });

$('#addIn').onclick=()=>addQ('inside'); $('#addOut').onclick=()=>addQ('outside'); $('#wordAdd').onclick=addWord;

      res(c.toDataURL('image/jpeg',.86)) }; im.onerror=rej; im.src=fr.result };

async function shotBoard(){
  try{ await document.fonts.ready }catch(e){}
  const W=Math.round(document.documentElement.clientWidth);
  const VH=Math.round(document.documentElement.clientHeight);

  let css='';
  for(const sh of document.styleSheets){ try{ for(const r of sh.cssRules) css+=r.cssText+'\n' }catch(e){} }

  const wrap=document.createElement('div');
  const bs=getComputedStyle(document.body);
  // 글꼴은 body 규칙이라 그림 안에서는 상속되지 않습니다 — 여기서 직접 지정합니다
  wrap.style.cssText='position:relative;width:'+W+'px;overflow:hidden;background:#fdfaf2;'
    +'font-family:'+bs.fontFamily+';color:'+bs.color+';-webkit-font-smoothing:antialiased';
  const scene=$('#scene').cloneNode(true);      // id 를 그대로 둬야 화면과 똑같은 규칙이 적용됩니다
  const app=$('#app').cloneNode(true);
  // 글자 크기를 화면에서 그대로 베껴 둡니다 (clamp·vw 값이 그림 안에서 달라지지 않도록)
  const srcEls=[$('#app'),...$('#app').querySelectorAll('*')], dstEls=[app,...app.querySelectorAll('*')];
  for(let i=0;i<srcEls.length&&i<dstEls.length;i++){
    const cs=getComputedStyle(srcEls[i]), d=dstEls[i].style;
    d.fontSize=cs.fontSize; d.lineHeight=cs.lineHeight; d.letterSpacing=cs.letterSpacing;
    if(dstEls[i].classList.contains('book')) d.height=cs.height;
  }
  app.querySelectorAll('input').forEach(i=>{ const o=$('#'+i.id); if(o) i.setAttribute('value',o.value||'') });
  app.querySelectorAll('textarea').forEach(t=>{ const o=$('#'+t.id); if(o) t.textContent=o.value||'' });
  app.style.height='auto'; app.style.minHeight=VH+'px';   // 화면 밖으로 넘친 질문까지 담기도록
  app.querySelectorAll('.list,.chips').forEach(l=>{ l.style.overflow='visible'; l.style.maxHeight='none' });
  app.querySelectorAll('.col,.side,.book,.words').forEach(el=>{ el.style.minHeight='0'; el.style.height='auto' });
  app.querySelectorAll('.apane,.pick').forEach(el=>el.remove());   // 적는 중인 칸은 기록에 남기지 않음

  probe.appendChild(wrap); document.body.appendChild(probe);

  const extra='#scene{position:absolute!important;inset:0!important}'
    +'#app{position:relative;z-index:1;height:auto!important;min-height:'+VH+'px}'
    /* 그림 한 장에는 움직임이 없으므로, 나타나는 효과의 첫 장면(투명)이 찍히지 않게 끕니다 */
    +'*{animation:none!important;transition:none!important}';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'">'
    +'<foreignObject x="0" y="0" width="'+W+'" height="'+H+'">'
    +'<div xmlns="http://www.w3.org/1999/xhtml"><style>'+css+extra+'</style>'+html+'</div>'
    +'</foreignObject></svg>';

  const url='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
  const im=new Image(); im.decoding='sync';
  await new Promise((res,rej)=>{ im.onload=res; im.onerror=()=>rej(new Error('그림으로 옮기지 못했어요')); im.src=url });
  const s=Math.min(2, 4000/Math.max(W,H));

  const x=c.getContext('2d'); x.fillStyle='#fdfaf2'; x.fillRect(0,0,c.width,c.height);
  x.setTransform(s,0,0,s,0,0); x.drawImage(im,0,0,W,H);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('빈 그림')),'image/png'));

 ['recs','우리 반 책장',openShelf]
];
const menu=$('#menu');
menu.innerHTML=MENU.map(m=>m?('<button data-m="'+m[1]+'">'+svg(m[0],22)+m[1]+'</button>'):'<hr>').join('');
paint(menu);
menu.addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return;
  menu.classList.remove('on'); const m=MENU.find(v=>v&&v[1]===b.dataset.m); if(m) m[2]() });
$('#bMenu').onclick=e=>{ e.stopPropagation();
  const r=$('#bMenu').getBoundingClientRect();
  menu.style.top=(r.bottom+10)+'px'; menu.style.left=Math.max(10,Math.min(r.right-264,innerWidth-274))+'px';
  menu.classList.toggle('on') };
document.addEventListener('click',e=>{ if(!e.target.closest('#menu')&&!e.target.closest('#bMenu')) menu.classList.remove('on') });

window.addEventListener('beforeunload',()=>{try{persist()}catch(e){}});

/* ── 글자 입력 창 ── */
let txFn=null;
function askText(title,val,fn){ $('#txT').textContent=title; $('#txIn').value=val||''; txFn=fn; open('#ovText');
  setTimeout(()=>{const i=$('#txIn');i.focus();i.select()},80) }
$('#txOk').onclick=()=>{ const v=$('#txIn').value.trim(); const f=txFn; close('#ovText'); txFn=null; if(f) f(v) };
$('#txIn').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();$('#txOk').click()} });

/* ── 우리 반 책장 ── */
function shelfOrder(){ return [...records].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)) }
/* 제목이 칸 밖으로 넘치면 넘치지 않을 때까지 글자를 줄입니다 */
function fitNames(g){
  g.querySelectorAll('.cname').forEach(el=>{
    if(el.parentElement.classList.contains('slot')) return;
    let fs=21; el.style.fontSize=fs+'px';
    let guard=0;
    while((el.scrollHeight>el.clientHeight+1 || el.scrollWidth>el.clientWidth+1) && fs>11 && guard++<14){
      fs-=1; el.style.fontSize=fs+'px';
    }
  });
}
const SLOT='<div class="cell slot"><div class="cv"></div><span class="cname">.</span><span class="cmeta">.</span></div>';
/* 책이 적어도 선반은 끝까지 이어지게 — 앞으로 책이 쌓일 자리를 보여 줍니다 */
function fillShelf(g,cols){
  const body=g.parentElement; if(!body) return;
  const one=g.querySelector('.cell'); if(!one) return;
  const ch=one.offsetHeight; if(!ch) return;
  let guard=0;
  while(g.offsetHeight+ch <= body.clientHeight+6 && guard++<8){
    let row=''; for(let i=0;i<cols;i++) row+=SLOT;
    g.insertAdjacentHTML('beforeend',row);
  }
}
async function openShelf(){
  persist();
  const list=shelfOrder(), g=$('#shGrid');
  $('#shelf').classList.add('on'); document.body.classList.add('cover');

  // 선반 칸 크기는 화면 높이에 맞춰 정합니다 — 두 줄이 화면을 채우도록
  const body = g.parentElement;
  const W = g.clientWidth || innerWidth-60;
  const BH = body.clientHeight || innerHeight-120;
  const nameh = 72;
  // 한 줄에 네 권씩. 좁은 화면(태블릿 세로)에서는 두 권씩.
  const cols = W >= 1000 ? 4 : 2;
  const cellW = Math.floor(W/cols) - 46;
  let cvw = Math.max(120, Math.min(cellW, 460));
  let cvh = Math.round(cvw*0.92);
  const maxH = Math.max(150, BH - (nameh+106));   // 첫 줄은 언제나 통째로 보이게
  if(cvh > maxH){ cvh = maxH; cvw = Math.min(cellW, Math.round(cvh/0.92)) }
  g.style.setProperty('--nameh', nameh+'px');
  g.style.setProperty('--cvw', cvw+'px');
  g.style.setProperty('--cvh', cvh+'px');
  g.style.gridTemplateColumns = 'repeat('+cols+', minmax(0,1fr))';

  let h='';
  for(const r of list){
    const now = r.id===cur.id && has(cur);
    h+='<div class="cell" data-open="'+r.id+'">'
      + '<div class="cv" data-cv="'+r.id+'">'
      +   (now?'<span class="badge">하는 중</span>':'')
      +   '<button class="cdel" data-del="'+r.id+'" aria-label="책장에서 빼기">'+svg('trash',20)+'</button>'
      +   '<div class="cvnone">'+svg('book',62)+'</div>'
      + '</div>'
      + '<span class="cname">'+esc(r.title||'이름 없는 그림책')+'</span>'
      + '<span class="cmeta">질문 '+nQs(r)+'개 · '+fmt(r.updatedAt)+'</span></div>';
  }
  if(!list.length) h+='<div class="cell newb" data-new="1"><div class="cv"><div class="cvnone">'+svg('plus',56)+'<span>새 그림책</span></div></div>'
   + '<span class="cname">여기서 시작해요</span><span class="cmeta">&nbsp;</span></div>';

  // 남은 자리와 다음 줄을 빈 선반으로 채워, 앞으로 쌓일 자리를 보여 줌
  const used = list.length + (list.length?0:1);
  const fill = (cols - (used % cols)) % cols;
  for(let i=0;i<fill;i++) h+=SLOT;

  g.innerHTML=h; paint(g);
  fitNames(g);
  fillShelf(g,cols);
  for(const r of list){ if(!r.image) continue;
    const d=imgCache[r.id]||await imgGet(r.id); if(!d) continue; imgCache[r.id]=d;
    const box=g.querySelector('[data-cv="'+r.id+'"]'); if(!box) continue;
    const im=document.createElement('img'); im.src=d; im.alt=r.title||'그림책';
    const ph=box.querySelector('.cvnone'); if(ph) ph.replaceWith(im);
  }
}
function closeShelf(){ $('#shelf').classList.remove('on'); document.body.classList.remove('cover') }
$('#shGrid').addEventListener('newbook',()=>startNewBook());
function startNewBook(){
  persist(); cur=newRec(); undoS=[]; $('#bUndo').classList.add('hid'); pick=null; apane=null;
  persist(); render(); closeShelf(); setTimeout(()=>$('#inIn').focus(),120);
  askText('새 그림책 이름 (그냥 두셔도 돼요)','',v=>{ if(v){ cur.title=v; persist(); render() } });
}
$('#shGrid').addEventListener('click',async e=>{
  const del=e.target.closest('[data-del]');
  if(del){ e.stopPropagation(); const id=del.dataset.del;
    ask('이 그림책을 책장에서 뺄까요?','그 책의 질문·답변·단어가 함께 사라집니다.\n학급 명단은 그대로 있습니다.',()=>{
      records=records.filter(v=>v.id!==id); imgDel(id); delete imgCache[id];
      if(cur.id===id){ cur=newRec(); undoS=[]; $('#bUndo').classList.add('hid') }
      persist(); render(); openShelf(); toast('책장에서 뺐어요.') }); return }
  const nb=e.target.closest('[data-new]');
  if(nb){ startNewBook(); return }
  if(e.target.closest('.cell.slot')) return;
  const op=e.target.closest('[data-open]');
  if(op){ const r=records.find(v=>v.id===op.dataset.open); if(!r) return;
    persist(); cur=clone(r); undoS=[]; $('#bUndo').classList.add('hid'); pick=null; apane=null;
    if(cur.image && !imgCache[cur.id]) imgCache[cur.id]=await imgGet(cur.id);
    render(); closeShelf(); toast(cur.title?('『'+cur.title+'』 질문 판이에요.'):'질문 판을 열었어요.') }
});
$('#shNew').onclick=()=>$('#shGrid').dispatchEvent(new CustomEvent('newbook'));
$('#shTidy').onclick=()=>{ const on=$('#shelf').classList.toggle('tidy');
  toast(on?'책을 빼려면 휴지통을 누르세요.':'정리를 마쳤어요.') };
$('#bShelf').onclick=openShelf;
$('#shRoster').onclick=()=>openRoster();

/* ── 표지 ── */
function showCover(){
  const n=nQs(cur), w=cur.words.length;
  $('#coverTx').textContent = '질문 놀이 시작';
  document.body.classList.add('cover'); $('#cover').classList.remove('off'); paint($('#cover'));
}
function hideCover(){ $('#cover').classList.add('off'); openShelf() }
$('#coverGo').onclick=hideCover;
$('#cover').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') hideCover() });

/* ── 시작 ── */
paint();
load().then(()=>{ render(); showCover(); setTimeout(()=>$('#coverGo').focus(),200) });
})();
</script>
