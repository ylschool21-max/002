<!doctype html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리반 미덕보석함 - 클라우드</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'virtue-box-v1';

    let currentUser = null;
    let students = [];
    
    const DEFAULT_VIRTUES = [
      { name: '사랑', shape: 'heart', c1: '#ff5a7a', c2: '#ff91a8', c3: '#ffd1dc' },
      { name: '친절', shape: 'diamond', c1: '#ff9a3c', c2: '#ffb96a', c3: '#ffe0b8' },
      { name: '감사', shape: 'star', c1: '#ffc93c', c2: '#ffd96a', c3: '#fff2b8' },
      { name: '도움', shape: 'hex', c1: '#4ade80', c2: '#86efac', c3: '#d1fae5' },
      { name: '예의', shape: 'shield', c1: '#22d3ee', c2: '#67e8f9', c3: '#cffafe' },
      { name: '질서', shape: 'square', c1: '#6366f1', c2: '#818cf8', c3: '#c7d2fe' },
      { name: '정돈', shape: 'rect', c1: '#475569', c2: '#94a3b8', c3: '#e2e8f0' },
      { name: '존중', shape: 'circle', c1: '#8b5cf6', c2: '#a78bfa', c3: '#ede9fe' },
      { name: '경청', shape: 'octagon', c1: '#ec4899', c2: '#f472b6', c3: '#fce7f3' },
      { name: '용기', shape: 'triangle', c1: '#ef4444', c2: '#f87171', c3: '#fee2e2' },
      { name: '협동', shape: 'rhombus', c1: '#f97316', c2: '#fb923c', c3: '#ffedd5' },
      { name: '우정', shape: 'heart', c1: '#f43f5e', c2: '#fb7185', c3: '#fff1f2' },
      { name: '용서', shape: 'circle', c1: '#10b981', c2: '#34d399', c3: '#d1fae5' },
      { name: '끈기', shape: 'pentagon', c1: '#b45309', c2: '#d97706', c3: '#fde68a' },
      { name: '책임', shape: 'shield', c1: '#1e40af', c2: '#3b82f6', c3: '#bfdbfe' },
      { name: '정직', shape: 'crystal', c1: '#0ea5e9', c2: '#38bdf8', c3: '#e0f2fe' },
      { name: '자율', shape: 'hex', c1: '#059669', c2: '#10b981', c3: '#a7f3d0' },
      { name: '창의성', shape: 'star', c1: '#8b5cf6', c2: '#c084fc', c3: '#f3e8ff' },
      { name: '상냥함', shape: 'heart', c1: '#fbcfe8', c2: '#f9a8d4', c3: '#f472b6' },
      { name: '너그러움', shape: 'circle', c1: '#fdba74', c2: '#fb923c', c3: '#ffedd5' },
      { name: '질문', shape: 'diamond', c1: '#2dd4bf', c2: '#5eead4', c3: '#ccfbf1' },
      { name: '지구', shape: 'circle', c1: '#3b82f6', c2: '#60a5fa', c3: '#93c5fd' }
    ];

    let config = {
      slotCount: 12,
      enabledVirtues: DEFAULT_VIRTUES.map(v => v.name),
      customVirtues: []
    };

    const BOX_COLORS = [
      'from-pink-100 to-rose-200 border-rose-300 text-rose-700',
      'from-blue-100 to-cyan-200 border-cyan-300 text-cyan-700',
      'from-green-100 to-emerald-200 border-emerald-300 text-emerald-700',
      'from-purple-100 to-violet-200 border-violet-300 text-violet-700',
      'from-amber-100 to-orange-200 border-orange-300 text-orange-700',
      'from-indigo-100 to-blue-200 border-blue-300 text-blue-700'
    ];

    const initAuth = async () => {
      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        const dataRef = doc(db, 'artifacts', appId, 'users', user.uid, 'appData', 'state');
        onSnapshot(dataRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            students = data.students || [];
            config = data.config || { slotCount: 12, enabledVirtues: DEFAULT_VIRTUES.map(v => v.name), customVirtues: [] };
          } else {
            students = [];
            config = { slotCount: 12, enabledVirtues: DEFAULT_VIRTUES.map(v => v.name), customVirtues: [] };
            saveToCloud();
          }
          renderApp();
        }, (err) => console.error("Firestore Error:", err));
      }
    });

    const saveToCloud = async (silent = true) => {
      if (!currentUser) return;
      const dataRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'appData', 'state');
      await setDoc(dataRef, { students, config, updatedAt: new Date().toISOString() });
      if (!silent) {
        showToast("보석함이 안전하게 저장되었습니다! ✨");
      }
    };

    window.manualSave = async () => {
      await saveToCloud(false);
      closeModal('box-modal');
    };

    window.addStudent = async () => {
      const input = document.getElementById('new-student-name');
      const name = input.value.trim();
      if (!name) return;
      students.push({ 
        id: Date.now().toString(), 
        name, 
        gems: [], 
        colorIdx: Math.floor(Math.random() * BOX_COLORS.length) 
      });
      input.value = '';
      await saveToCloud();
      showToast(`${name} 친구가 추가되었어요!`);
      renderSettings();
    };

    window.removeStudent = async (id) => {
      students = students.filter(s => s.id !== id);
      await saveToCloud();
      renderSettings();
    };

    window.addCustomVirtue = async () => {
      const nameInput = document.getElementById('custom-virtue-name');
      const colorInput = document.getElementById('custom-virtue-color');
      const name = nameInput.value.trim();
      const baseColor = colorInput.value;

      if (!name) return;
      const allNames = [...DEFAULT_VIRTUES, ...(config.customVirtues || [])].map(v => v.name);
      if (allNames.includes(name)) {
        showToast("이미 존재하는 미덕 이름이에요!", "error");
        return;
      }

      const newVirtue = {
        name,
        shape: 'crystal',
        c1: baseColor,
        c2: adjustColor(baseColor, 40),
        c3: adjustColor(baseColor, 80)
      };

      if (!config.customVirtues) config.customVirtues = [];
      config.customVirtues.push(newVirtue);
      config.enabledVirtues.push(name);
      
      nameInput.value = '';
      await saveToCloud();
      showToast(`${name} 미덕이 추가되었습니다!`);
      renderSettings();
    };

    window.removeCustomVirtue = async (name) => {
      config.customVirtues = (config.customVirtues || []).filter(v => v.name !== name);
      config.enabledVirtues = config.enabledVirtues.filter(n => n !== name);
      await saveToCloud();
      renderSettings();
    };

    function adjustColor(hex, percent) {
      const num = parseInt(hex.replace("#",""), 16);
      const amt = Math.round(2.55 * percent);
      const R = (num >> 16) + amt;
      const G = (num >> 8 & 0x00FF) + amt;
      const B = (num & 0x0000FF) + amt;
      return "#" + (0x1000000 + (R<255?R<0?0:R:255)*0x10000 + (G<255?G<0?0:G:255)*0x100 + (B<255?B<0?0:B:255)).toString(16).slice(1);
    }

    // Drag and Drop Handlers
    window.handleDragStart = (e, virtueName) => {
      e.dataTransfer.setData('virtueName', virtueName);
      e.currentTarget.classList.add('opacity-50', 'scale-90');
    };

    window.handleDragEnd = (e) => {
      e.currentTarget.classList.remove('opacity-50', 'scale-90');
    };

    window.handleDragOver = (e) => {
      e.preventDefault();
      const target = e.currentTarget;
      if (!target.classList.contains('has-gem')) {
        target.classList.add('bg-amber-100', 'border-amber-400', 'scale-105');
      }
    };

    window.handleDragLeave = (e) => {
      const target = e.currentTarget;
      target.classList.remove('bg-amber-100', 'border-amber-400', 'scale-105');
    };

    window.handleDrop = (e, slotIndex) => {
      e.preventDefault();
      const target = e.currentTarget;
      target.classList.remove('bg-amber-100', 'border-amber-400', 'scale-105');
      
      const virtueName = e.dataTransfer.getData('virtueName');
      const studentId = document.getElementById('box-modal').dataset.currentId;
      
      if (virtueName && studentId) {
        window.addGem(studentId, virtueName, slotIndex);
      }
    };

    window.addGem = async (studentId, type, slotIndex) => {
      const student = students.find(s => s.id === studentId);
      if (!student || student.gems.some(g => g.slot === slotIndex)) return;
      student.gems.push({ type, slot: slotIndex });
      renderSlots(studentId);
    };

    window.removeGem = async (studentId, slotIndex) => {
      const student = students.find(s => s.id === studentId);
      if (!student) return;
      student.gems = student.gems.filter(g => g.slot !== slotIndex);
      renderSlots(studentId);
    };

    window.updateConfig = async (newConfig) => {
      config = { ...config, ...newConfig };
      students.forEach(s => s.gems = s.gems.filter(g => g.slot < config.slotCount));
      await saveToCloud();
    };

    window.onload = () => { initAuth(); buildStars(); };

    function renderApp() {
      const grid = document.getElementById('boxes-grid');
      const empty = document.getElementById('empty-state');
      if (students.length === 0) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');

      grid.innerHTML = students.map(s => {
        const colorClass = BOX_COLORS[s.colorIdx || 0];
        return `
        <div class="bg-gradient-to-br ${colorClass} border-2 rounded-3xl p-6 transition cursor-pointer shadow-lg hover:scale-105 transform duration-200" onclick="openBox('${s.id}')">
          <div class="flex justify-between items-center mb-6">
            <div class="bg-white/50 p-3 rounded-2xl shadow-sm"><i data-lucide="sparkles" class="w-6 h-6"></i></div>
            <div class="flex flex-col items-end">
              <span class="text-xs font-bold opacity-60 uppercase">보석 현황</span>
              <span class="text-xl font-black display-font">${s.gems.length} / ${config.slotCount}</span>
            </div>
          </div>
          <h3 class="display-font text-4xl mb-2 drop-shadow-sm">${s.name}</h3>
          <div class="text-sm font-bold opacity-70 bg-white/30 rounded-lg py-2 px-4 inline-block">
            클릭하여 보석함 열기 ✨
          </div>
        </div>
      `}).join('');
      lucide.createIcons();
    }

    window.openBox = (id) => {
      const student = students.find(s => s.id === id);
      if (!student) return;
      document.getElementById('target-name').textContent = student.name;
      document.getElementById('box-modal').dataset.currentId = id;
      
      renderPalette();
      renderSlots(id);
      document.getElementById('box-modal').classList.replace('hidden', 'flex');
    };

    function renderPalette() {
      const palette = document.getElementById('gem-palette');
      const allVirtues = [...DEFAULT_VIRTUES, ...(config.customVirtues || [])];
      const enabled = allVirtues.filter(v => config.enabledVirtues.includes(v.name));
      palette.innerHTML = enabled.map(v => `
        <div class="flex flex-col items-center p-3 rounded-2xl hover:bg-white/80 cursor-grab active:cursor-grabbing transition transform hover:scale-110 shadow-sm hover:shadow-md border border-transparent hover:border-amber-100 group" 
             draggable="true" 
             ondragstart="handleDragStart(event, '${v.name}')" 
             ondragend="handleDragEnd(event)"
             onclick="addGemToFirstEmpty('${v.name}')">
          <div class="group-hover:animate-pulse">
            ${getGemSvg(v.name, 60)}
          </div>
          <span class="text-sm mt-2 font-bold text-gray-700">${v.name}</span>
        </div>
      `).join('');
    }

    window.renderSlots = (id) => {
      const student = students.find(s => s.id === id);
      const grid = document.getElementById('slots-grid');
      let html = '';
      for (let i = 0; i < config.slotCount; i++) {
        const gem = student.gems.find(g => g.slot === i);
        html += `
          <div class="aspect-square rounded-2xl border-2 border-dashed border-white/60 bg-white/30 flex flex-col items-center justify-center relative shadow-inner transition-all duration-200 overflow-hidden ${gem ? 'has-gem p-1' : 'empty-slot p-2'}"
               ondragover="handleDragOver(event)"
               ondragleave="handleDragLeave(event)"
               ondrop="handleDrop(event, ${i})">
            ${gem ? `
              <div class="cursor-pointer flex flex-col items-center group animate-bounce-slow h-full w-full justify-center" onclick="removeGem('${id}', ${i})">
                <div class="shrink-0 scale-90 sm:scale-100">${getGemSvg(gem.type, 50)}</div>
                <span class="text-[10px] sm:text-xs font-bold text-amber-900 mt-1 truncate max-w-full px-1 bg-white/40 rounded-md leading-tight">${gem.type}</span>
                <div class="absolute inset-0 bg-red-500/20 opacity-0 group-hover:opacity-100 rounded-2xl flex items-center justify-center transition">
                  <i data-lucide="trash-2" class="text-white drop-shadow-md w-6 h-6"></i>
                </div>
              </div>
            ` : `<span class="text-white/50 text-xs font-bold pointer-events-none">${i+1}</span>`}
          </div>
        `;
      }
      grid.innerHTML = html;
      lucide.createIcons();
    };

    window.addGemToFirstEmpty = (type) => {
      const id = document.getElementById('box-modal').dataset.currentId;
      const student = students.find(s => s.id === id);
      if (!student) return;
      const occupied = student.gems.map(g => g.slot);
      for(let i=0; i<config.slotCount; i++) {
        if(!occupied.includes(i)) {
          window.addGem(id, type, i);
          return;
        }
      }
      showToast("보석함이 이미 꽉 찼어요!", "error");
    };

    window.renderSettings = () => {
      const studentList = document.getElementById('student-list-admin');
      studentList.innerHTML = students.map(s => `
        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl px-4 border border-gray-100 shadow-sm">
          <span class="font-bold text-gray-700">${s.name}</span>
          <button onclick="removeStudent('${s.id}')" class="text-red-400 hover:text-red-600 p-1"><i data-lucide="trash-2" size="18"></i></button>
        </div>
      `).join('');
      
      const allVirtues = [...DEFAULT_VIRTUES, ...(config.customVirtues || [])];
      const virtueAdmin = document.getElementById('virtue-list-admin');
      virtueAdmin.innerHTML = allVirtues.map(v => {
        const isCustom = (config.customVirtues || []).some(cv => cv.name === v.name);
        return `
        <div class="flex items-center justify-between p-2 rounded-lg hover:bg-amber-50 group border border-transparent hover:border-amber-200">
          <label class="flex items-center gap-3 cursor-pointer flex-1">
            <input type="checkbox" onchange="toggleVirtue('${v.name}')" ${config.enabledVirtues.includes(v.name) ? 'checked' : ''} class="w-5 h-5 accent-amber-500">
            <span class="text-sm font-bold text-gray-700">${v.name} ${isCustom ? '🎨' : ''}</span>
          </label>
          ${isCustom ? `<button onclick="removeCustomVirtue('${v.name}')" class="text-gray-300 hover:text-red-500 transition-colors"><i data-lucide="x-circle" size="16"></i></button>` : ''}
        </div>
      `}).join('');
      
      document.getElementById('slot-count-input').value = config.slotCount;
      lucide.createIcons();
    };

    window.toggleVirtue = (name) => {
      let enabled = [...config.enabledVirtues];
      if (enabled.includes(name)) enabled = enabled.filter(n => n !== name);
      else enabled.push(name);
      window.updateConfig({ enabledVirtues: enabled });
    };

    window.handleSlotCountInput = (e) => {
      let val = parseInt(e.target.value);
      if (isNaN(val) || val < 1) val = 1;
      if (val > 100) val = 100;
      window.updateConfig({ slotCount: val });
    };

    function getGemSvg(virtue, size = 48) {
      const all = [...DEFAULT_VIRTUES, ...(config.customVirtues || [])];
      const v = all.find(v => v.name === virtue) || DEFAULT_VIRTUES[0];
      const gid = 'g' + Math.random().toString(36).substr(2, 5);
      
      let element = "";
      switch(v.shape) {
        case 'heart': element = `<path d="M50,30 C35,10 10,25 10,45 C10,65 35,85 50,95 C65,85 90,65 90,45 C90,25 65,10 50,30" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'star': element = `<polygon points="50,5 63,35 95,35 70,55 80,85 50,70 20,85 30,55 5,35 37,35" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'diamond': element = `<polygon points="50,5 90,50 50,95 10,50" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'hex': element = `<polygon points="50,5 85,25 85,75 50,95 15,75 15,25" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'circle': element = `<circle cx="50" cy="50" r="40" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'triangle': element = `<polygon points="50,5 95,85 5,85" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'rhombus': element = `<polygon points="50,5 80,50 50,95 20,50" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'octagon': element = `<polygon points="30,5 70,5 95,30 95,70 70,95 30,95 5,70 5,30" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'square': element = `<rect x="15" y="15" width="70" height="70" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'rect': element = `<rect x="10" y="30" width="80" height="40" rx="10" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'pentagon': element = `<polygon points="50,5 95,35 80,85 20,85 5,35" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'shield': element = `<path d="M10,10 L90,10 L90,50 C90,75 50,95 50,95 C50,95 10,75 10,50 Z" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        case 'crystal': element = `<polygon points="50,5 80,20 80,80 50,95 20,80 20,20" fill="url(#${gid})" stroke="white" stroke-width="2"/>`; break;
        default: element = `<polygon points="50,5 90,30 90,70 50,95 10,70 10,30" fill="url(#${gid})" stroke="white" stroke-width="2"/>`;
      }

      return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="drop-shadow-lg overflow-visible pointer-events-none">
        <defs>
          <linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${v.c3 || '#fff'}"/><stop offset="50%" stop-color="${v.c2 || '#ddd'}"/><stop offset="100%" stop-color="${v.c1 || '#000'}"/>
          </linearGradient>
        </defs>
        ${element}
        <circle cx="35" cy="30" r="5" fill="white" opacity="0.6"/>
        <path d="M55,20 L65,25" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
      </svg>`;
    }

    function buildStars() {
      const container = document.getElementById('stars-bg');
      for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'absolute animate-pulse';
        star.style.top = Math.random() * 100 + '%';
        star.style.left = Math.random() * 100 + '%';
        star.style.fontSize = (Math.random() * 12 + 8) + 'px';
        star.textContent = ['✨','⭐','🌟','💎'][Math.floor(Math.random()*4)];
        star.style.animationDelay = Math.random() * 3 + 's';
        container.appendChild(star);
      }
    }

    window.showToast = (msg, type = 'success') => {
      const t = document.createElement('div');
      t.className = `fixed bottom-10 left-1/2 -translate-x-1/2 px-8 py-4 rounded-3xl text-white font-bold z-[100] transition-all duration-500 shadow-2xl display-font text-lg ${type === 'success' ? 'bg-amber-500' : 'bg-red-500'}`;
      t.innerHTML = (type === 'success' ? '✅ ' : '❌ ') + msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 2000);
    };

    window.closeModal = (id) => document.getElementById(id).classList.replace('flex', 'hidden');
  </script>

  <style>
    body { font-family: 'Gaegu', cursive; background: #fffbeb; background-image: radial-gradient(#fde68a 0.5px, transparent 0.5px); background-size: 24px 24px; }
    .display-font { font-family: 'Jua', sans-serif; }
    .modal-backdrop { background: rgba(120, 90, 40, 0.4); backdrop-filter: blur(16px); }
    @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .animate-bounce-slow { animation: bounce-slow 3s infinite ease-in-out; }
    
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { opacity: 1; height: 40px; }

    .settings-btn:hover { transform: scale(1.1) rotate(15deg); }
    .settings-btn svg { transition: transform 0.5s ease; }
    .settings-btn:hover svg { transform: rotate(90deg); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #fffbeb; }
    ::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }

    .save-btn-animation {
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .save-btn-animation:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);
    }
    
    .cursor-grab { cursor: grab; }
    .cursor-grabbing { cursor: grabbing; }
    
    .empty-slot:hover {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
    }
  </style>
</head>
<body class="h-full select-none overflow-x-hidden text-gray-800">
  <div id="stars-bg" class="fixed inset-0 pointer-events-none z-0"></div>

  <main class="relative z-10 p-6 md:p-10 max-w-7xl mx-auto">
    <header class="text-center mb-12 relative flex flex-col items-center">
      <h1 class="text-6xl md:text-8xl font-bold text-amber-600 drop-shadow-md display-font mb-4">✨ 우리반 미덕보석함 ✨</h1>
      <p class="text-2xl md:text-3xl text-amber-800 font-bold bg-white/60 inline-block px-10 py-3 rounded-full border-2 border-amber-200 shadow-sm">내 마음 속 미덕 보석을 깨워주세요 !</p>
      
      <button onclick="renderSettings(); document.getElementById('settings-modal').classList.replace('hidden', 'flex')" 
              class="settings-btn absolute right-0 top-0 p-4 bg-white rounded-3xl border-4 border-amber-100 shadow-lg hover:shadow-xl hover:bg-amber-50 active:scale-95 transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2v.44a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2v-.44a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </header>

    <div id="boxes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    
    <div id="empty-state" class="hidden text-center py-24 bg-white/70 rounded-[3rem] border-4 border-dashed border-amber-300 shadow-inner">
      <div class="text-8xl mb-6">🪄</div>
      <p class="text-4xl font-bold text-amber-800 display-font">아직 깨어난 보석함이 없어요!</p>
      <p class="text-amber-700 mt-6 text-2xl font-bold">설정 버튼을 눌러 친구들의 이름을 적어주세요.</p>
    </div>
  </main>

  <!-- 상세 보석함 모달 -->
  <div id="box-modal" class="hidden fixed inset-0 z-50 modal-backdrop items-center justify-center p-4">
    <div class="bg-white rounded-[4rem] max-w-7xl w-full h-[90vh] overflow-hidden shadow-2xl flex flex-col border-[12px] border-amber-100 relative">
      <div class="p-6 md:p-8 border-b bg-amber-50 flex justify-between items-center shrink-0">
        <h2 class="display-font text-4xl md:text-5xl text-amber-800 flex items-center gap-4">
          <span class="bg-white px-6 py-2 rounded-3xl shadow-sm"><span id="target-name"></span></span>
          <span class="text-3xl opacity-80 shrink-0">의 반짝이는 보석함</span>
        </h2>
        <button onclick="closeModal('box-modal')" class="p-4 hover:bg-amber-200 rounded-full transition-all text-amber-700 active:scale-90">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      
      <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- Palette Area -->
        <div class="w-full md:w-5/12 p-6 md:p-10 border-b md:border-b-0 md:border-r border-amber-100 overflow-y-auto bg-amber-50/30">
          <h3 class="display-font text-3xl text-amber-700 mb-4 flex items-center gap-3">
            <span class="text-4xl">💎</span> 미덕 보석 선택하기
          </h3>
          <p class="text-amber-600 font-bold mb-8 bg-amber-100/50 inline-block px-4 py-1 rounded-full text-lg">💡 보석을 드래그해서 칸에 넣어보세요!</p>
          <div id="gem-palette" class="grid grid-cols-3 sm:grid-cols-4 gap-4"></div>
        </div>
        
        <!-- Box Grid Area -->
        <div class="w-full md:w-7/12 p-6 md:p-10 overflow-y-auto bg-white flex flex-col">
          <div class="flex justify-between items-center mb-6">
            <h3 class="display-font text-3xl text-amber-700 flex items-center gap-3">
              <span class="text-4xl">🎁</span> 보석 담기
            </h3>
            <button onclick="manualSave()" class="save-btn-animation bg-amber-500 hover:bg-amber-600 text-white px-8 py-3 rounded-2xl font-bold text-xl flex items-center gap-2 shadow-lg active:scale-95">
              <i data-lucide="save" class="w-5 h-5"></i> 보석함 저장하기
            </button>
          </div>
          <div id="box-display-container" class="flex-1 p-4 sm:p-8 rounded-[3rem] shadow-inner border-4 border-amber-50 bg-amber-50/20 overflow-y-auto">
            <div id="slots-grid" class="grid grid-cols-4 sm:grid-cols-5 gap-3 sm:gap-4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div id="settings-modal" class="hidden fixed inset-0 z-50 modal-backdrop items-center justify-center p-4">
    <div class="bg-white rounded-[3rem] max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl flex flex-col border-4 border-amber-200">
      <div class="p-8 border-b bg-gray-50 flex justify-between items-center shrink-0">
        <h2 class="display-font text-3xl text-gray-800 flex items-center gap-3">🛠️ 보석함 관리 설정</h2>
        <button onclick="closeModal('settings-modal')" class="p-2 hover:bg-gray-100 rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      
      <div class="p-10 overflow-y-auto space-y-12">
        <section class="bg-amber-50/50 p-8 rounded-[2.5rem] border-2 border-amber-100 shadow-sm">
          <h3 class="display-font text-2xl text-amber-700 mb-6 flex items-center gap-2">📏 보석함 칸수 설정</h3>
          <div class="flex items-center gap-6">
            <div class="relative flex-1">
              <input type="number" id="slot-count-input" min="1" max="100" 
                     oninput="handleSlotCountInput(event)" 
                     class="w-full text-3xl font-bold text-amber-600 bg-white px-8 py-4 rounded-2xl border-4 border-amber-200 focus:border-amber-500 outline-none shadow-sm transition-all text-center">
              <span class="absolute right-6 top-1/2 -translate-y-1/2 text-xl font-bold text-amber-400">칸</span>
            </div>
            <p class="text-xl text-amber-800/70 font-bold leading-tight">
              친구들의 보석함이<br>총 몇 칸인가요? (1~100)
            </p>
          </div>
        </section>

        <section>
          <h3 class="display-font text-2xl text-amber-700 mb-6 flex items-center gap-2">👥 친구 이름 추가</h3>
          <div class="flex gap-4 mb-6">
            <input id="new-student-name" type="text" placeholder="친구 이름을 입력하세요" class="flex-1 border-4 border-amber-100 rounded-2xl px-6 py-4 outline-none focus:border-amber-400 text-xl transition-all shadow-sm">
            <button onclick="addStudent()" class="bg-amber-500 hover:bg-amber-600 text-white px-10 py-4 rounded-2xl font-bold text-2xl shadow-lg transition-all active:scale-95">추가</button>
          </div>
          <div id="student-list-admin" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
        </section>

        <section class="bg-amber-50 p-8 rounded-[2.5rem] border-2 border-amber-200 shadow-inner">
          <h3 class="display-font text-2xl text-amber-700 mb-6 flex items-center gap-2">🎨 새로운 미덕 보석 만들기</h3>
          <div class="flex flex-col sm:flex-row gap-4 mb-4">
            <input id="custom-virtue-name" type="text" placeholder="예: 나눔, 용기..." class="flex-1 border-2 border-white rounded-xl px-5 py-4 outline-none focus:border-amber-400 shadow-sm text-xl">
            <div class="flex items-center gap-3 bg-white px-5 py-4 rounded-xl border-2 border-white shadow-sm">
              <span class="text-lg font-bold text-gray-500">색상:</span>
              <input id="custom-virtue-color" type="color" value="#fbbf24" class="w-12 h-12 rounded-full border-none cursor-pointer">
            </div>
            <button onclick="addCustomVirtue()" class="bg-amber-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-amber-700 transition-colors shadow-lg active:scale-95 text-xl">보석 생성</button>
          </div>
        </section>

        <section>
          <h3 class="display-font text-2xl text-amber-700 mb-6 flex items-center gap-2">✅ 사용중인 미덕 목록</h3>
          <div id="virtue-list-admin" class="grid grid-cols-2 md:grid-cols-4 gap-2 bg-white/50 p-6 rounded-3xl border-2 border-amber-100 shadow-inner"></div>
        </section>
      </div>
      
      <div class="p-8 border-t bg-gray-50 flex justify-center shrink-0">
        <button onclick="closeModal('settings-modal')" class="bg-green-500 hover:bg-green-600 text-white px-20 py-5 rounded-3xl font-bold text-3xl shadow-xl transition-all transform active:scale-95">반짝이는 설정 완료!</button>
      </div>
    </div>
  </div>
</body>
</html>
