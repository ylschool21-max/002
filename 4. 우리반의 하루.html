<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리반의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fff2e2;
  --ink:#3a3030;
  --muted:#7b6b6b;
  --pink:#f8c8d7;
  --hot:#f7a1bd;
  --cream:#fffaf2;
  --yellow:#fff1b8;
  --blue:#d8f1f8;
  --green:#dff2e4;
  --peach:#ffe7cc;
  --mint:#addfbd;
  --shadow:0 16px 32px rgba(86,59,43,.10);
  --soft-shadow:0 10px 18px rgba(86,59,43,.08);
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Jua','Noto Sans KR',sans-serif;
  min-height:100vh;
}
.app {
  max-width:1460px;
  margin:0 auto;
  padding:8px 28px 36px;
}
.top {
  display:flex;
  justify-content:center;
  padding:0 0 14px;
}
.title-pill {
  min-width:440px;
  padding:10px 32px 12px;
  border-radius:999px;
  background:linear-gradient(90deg,#ffe8d2 0%,#ffd1e1 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  font-size:2.7rem;
  line-height:1;
  box-shadow:0 10px 20px rgba(194,133,115,.10);
}
.title-pill .ico { font-size:2.1rem; }
.tabs {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:22px;
}
.tab {
  height:70px;
  border:none;
  border-radius:20px;
  background:#fffdfb;
  color:#715d5d;
  font-size:1.35rem;
  font-weight:700;
  cursor:pointer;
  box-shadow:var(--soft-shadow);
}
.tab.active {
  border:3px solid var(--hot);
  background:#fff7fa;
  color:#2e2424;
}
.section { display:none; }
.section.active { display:block; }

.day-grid {
  display:grid;
  grid-template-columns: 1.08fr 1.08fr 1.08fr;
  gap:20px;
  align-items:start;
}
.left-stack { display:flex; flex-direction:column; gap:18px; }
.card {
  border-radius:30px;
  padding:26px;
  background:#fffdf9;
  box-shadow:var(--shadow);
}
.card.date { background:#ffecd9; min-height:188px; }
.card.weather { background:#dff4fb; min-height:330px; }
.card.air { background:#def3e6; min-height:310px; }
.card.activities { background:#fff7fb; min-height:640px; }
.card.schedule { background:#fffdf2; min-height:300px; }

.card-title {
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 24px;
  font-size:1.8rem;
  color:#362d2d;
}
.date-big {
  text-align:center;
  font-size:2.2rem;
  margin-top:40px;
}
.weekday {
  display:inline-block;
  margin-left:10px;
  background:#f6c9d7;
  padding:4px 16px 8px;
  border-radius:14px;
}
.weather-prompt {
  font-size:1.55rem;
  text-align:center;
  color:#7d7474;
  margin:52px 0 38px;
}
.weather-list {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.weather-btn {
  height:98px;
  border:0;
  border-radius:14px;
  background:#fff;
  box-shadow:0 8px 12px rgba(82,77,70,.08);
  cursor:pointer;
  font-size:1.05rem;
  color:#7b5e4d;
}
.weather-btn .w-ico {
  display:block;
  font-size:2rem;
  margin-bottom:6px;
}
.weather-btn.active {
  outline:4px solid rgba(247,161,189,.45);
}
.air-row {
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
.air-row input {
  flex:1;
  height:54px;
  border:2px solid #edd6c8;
  border-radius:14px;
  padding:0 16px;
  font-family:'Gaegu',cursive;
  font-size:1.35rem;
  background:white;
}
.air-row button, .small-btn {
  height:54px;
  border:0;
  border-radius:16px;
  padding:0 20px;
  background:#a9dfbd;
  color:#2f5d3a;
  font-weight:700;
  font-size:1.2rem;
  cursor:pointer;
}
.air-status {
  min-height:88px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.85);
  border-radius:18px;
  margin:12px 0 18px;
  font-size:1.45rem;
}
.air-quick {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.air-quick button {
  min-height:76px;
  border:0;
  border-radius:14px;
  background:white;
  box-shadow:0 6px 10px rgba(75,67,60,.07);
  font-size:1.05rem;
  cursor:pointer;
}
.air-good { color:#0ca678; }
.air-normal { color:#e67700; }
.air-bad { color:#f76707; }
.air-verybad { color:#c92a2a; }

.activity-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.activity {
  height:122px;
  border:0;
  border-radius:22px;
  cursor:pointer;
  font-size:1.35rem;
  color:#2e2929;
  box-shadow:0 10px 14px rgba(100,73,68,.08);
  font-family:'Jua','Noto Sans KR',sans-serif;
}
.activity .circle {
  width:54px;
  height:54px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  background:rgba(255,255,255,.72);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.08);
  font-size:2rem;
}
.a-pink { background:#fbc9d7; }
.a-yellow { background:#fff0ae; }
.a-blue { background:#cdeef8; }
.a-green { background:#d5f1df; }
.a-purple { background:#e8d9ff; }
.a-orange { background:#ffdbb4; }
.custom-row {
  display:grid;
  grid-template-columns:1fr 110px;
  gap:10px;
  margin-top:16px;
}
.custom-row input, .lunch-top input, textarea {
  border:2px solid #ead5c8;
  border-radius:16px;
  padding:0 16px;
  height:58px;
  background:white;
  font-family:'Gaegu',cursive;
  font-size:1.35rem;
}
.add-btn {
  border:0;
  border-radius:20px;
  background:#f7a1bd;
  color:white;
  font-size:1.5rem;
  font-weight:700;
  cursor:pointer;
}
.schedule-empty {
  min-height:164px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#725f5f;
  font-family:'Gaegu',cursive;
  font-size:1.55rem;
  line-height:1.45;
}
.schedule-list {
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:160px;
}
.schedule-item {
  display:flex;
  align-items:center;
  gap:12px;
  min-height:58px;
  padding:8px 12px;
  border-radius:18px;
  background:#fff;
  box-shadow:0 6px 12px rgba(70,57,50,.08);
  font-size:1.35rem;
  cursor:grab;
}
.num {
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#f7a1bd;
  color:white;
  font-size:1rem;
}
.delete {
  margin-left:auto;
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:#fff1f3;
  color:#ff6b6b;
  font-weight:900;
  cursor:pointer;
}
.save-main {
  width:100%;
  height:76px;
  border:0;
  border-radius:18px;
  background:#a9dfbd;
  color:#3a3030;
  font-size:1.45rem;
  margin-top:18px;
  cursor:pointer;
}

.lunch-card {
  background:#fffdfb;
  padding:28px;
}
.lunch-top {
  display:grid;
  grid-template-columns:180px 1fr 130px 165px;
  gap:12px;
  margin:0 0 10px;
}
.lunch-top input { height:58px; font-family:'Noto Sans KR',sans-serif; font-size:1.1rem; }
.lunch-note {
  color:#837272;
  font-family:'Noto Sans KR',sans-serif;
  font-weight:700;
  margin-bottom:10px;
}
.tray-wrap {
  display:flex;
  justify-content:center;
  overflow:visible;
  padding:4px 0 0;
}

.slot {
  position:absolute;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  align-content:center;
  justify-content:center;
  gap:6px;
  padding:6px;
}
.tl { left:6.9%; top:5.5%; width:20.2%; height:32.5%; }
.tm1 { left:31.2%; top:5.5%; width:20.2%; height:32.5%; }
.tm2 { left:55.0%; top:5.5%; width:20.2%; height:32.5%; }
.tr { left:78.9%; top:5.5%; width:20.2%; height:32.5%; }
.bl { left:6.9%; top:42.8%; width:44.4%; height:42.0%; }
.br { left:55.0%; top:42.8%; width:44.1%; height:42.0%; }
.food {
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:98%;
  padding:5px 24px 5px 9px;
  border-radius:12px;
  background:rgba(255,255,255,.76);
  border:1px solid rgba(217,200,166,.5);
  color:#835a38;
  font-family:'Gaegu',cursive;
  font-size:1.85rem;
  font-weight:700;
  line-height:1;
  cursor:pointer;
}
.food.selected {
  outline:4px solid #f7a1bd;
  outline-offset:2px;
}
.food button {
  position:absolute;
  right:4px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  border:0;
  border-radius:50%;
  background:#fff1f3;
  color:#ff6b6b;
  font-weight:900;
  line-height:18px;
  padding:0;
  cursor:pointer;
}

.simple-grid {
  display:grid;
  grid-template-columns:360px 1fr;
  gap:20px;
}
.list-box, .editor-box {
  background:#fffdfb;
  border-radius:30px;
  padding:26px;
  box-shadow:var(--shadow);
}
.record-card {
  background:white;
  border-radius:18px;
  padding:14px;
  margin:8px 0;
  box-shadow:0 6px 12px rgba(70,57,50,.07);
  cursor:pointer;
}
.editor-row {
  display:grid;
  grid-template-columns:90px 1fr;
  gap:10px;
  margin:10px 0;
}
.editor-row label {
  background:#fff1f3;
  border-radius:16px;
  padding:16px 8px;
  text-align:center;
  color:#be4b72;
}
.editor-row textarea {
  height:100px;
  padding:14px;
  resize:vertical;
}
.story-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;
}
.story-card {
  background:white;
  border-radius:22px;
  padding:18px;
  box-shadow:var(--soft-shadow);
}
.chips {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0;
}
.chip {
  border-radius:999px;
  background:#fff1d6;
  padding:5px 10px;
  font-size:.95rem;
}
.toast {
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:#3a3030;
  color:white;
  padding:13px 22px;
  border-radius:999px;
  z-index:100;
  display:none;
}
@media(max-width:1100px) {
  .day-grid, .simple-grid { grid-template-columns:1fr; }
  .tabs { grid-template-columns:repeat(2,1fr); }
  .lunch-top { grid-template-columns:1fr; }
}

/* v2 수정: 글꼴 통일, 날짜 카드 강조, 식판 화면 꽉 차게, 밥/국 글자 확대 */
body,
button,
input,
textarea,
.tab,
.card-title,
.date-big,
.weather-prompt,
.weather-btn,
.air-row input,
.custom-row input,
.lunch-top input,
.schedule-empty,
.food,
.title-pill,
.activity,
.schedule-item,
.record-card,
.editor-row label,
.story-card {
  font-family:'Jua','Noto Sans KR',sans-serif !important;
}

/* 오늘의 날짜 카드 색상 강조 */
.card.date {
  background:linear-gradient(135deg,#ffe066 0%,#ffd43b 45%,#ffb86b 100%) !important;
  box-shadow:0 16px 32px rgba(255,184,0,.22) !important;
}
.card.date .card-title {
  color:#3a3030 !important;
}
.date-big {
  color:#2e2424 !important;
}
.weekday {
  background:#fff7cc !important;
  color:#2e2424 !important;
  box-shadow:0 4px 10px rgba(110,80,20,.10) !important;
}

/* 오늘의 식단 화면을 한 화면에 더 꽉 차게 */
.lunch-card {
  padding:20px 24px 18px !important;
  min-height:calc(100vh - 190px) !important;
  overflow:hidden !important;
}
.lunch-card .card-title {
  margin-bottom:16px !important;
}
.lunch-top {
  grid-template-columns:180px 1fr 130px 135px !important;
  gap:10px !important;
  margin-bottom:6px !important;
}
.lunch-top input {
  height:52px !important;
}
.lunch-top .add-btn,
.lunch-top .small-btn {
  height:52px !important;
}
.lunch-note {
  margin-bottom:2px !important;
  font-size:.95rem !important;
}
.tray-wrap {
  padding-top:0 !important;
  align-items:flex-start !important;
}
.tray {
  width:min(96vw, 1060px) !important;
  max-width:1060px !important;
  margin-top:-2px !important;
}

/* 식판 안 음식 이름 기본 정리 */
.food {
  font-size:1.75rem !important;
  padding:5px 24px 5px 9px !important;
}

/* 밥/국 칸, 즉 하단 좌우 칸 음식 이름은 1.5배 크게 */
.slot.bl .food,
.slot.br .food {
  font-size:2.65rem !important;
  padding:6px 30px 6px 12px !important;
  border-radius:15px !important;
}
.slot.bl .food button,
.slot.br .food button {
  width:22px !important;
  height:22px !important;
  line-height:22px !important;
  font-size:.9rem !important;
  right:5px !important;
}

/* 식판 크기 확대 후 칸 좌표 미세 조정 */
.tl { left:6.9% !important; top:5.5% !important; width:20.2% !important; height:32.5% !important; }
.tm1 { left:31.2% !important; top:5.5% !important; width:20.2% !important; height:32.5% !important; }
.tm2 { left:55.0% !important; top:5.5% !important; width:20.2% !important; height:32.5% !important; }
.tr { left:78.9% !important; top:5.5% !important; width:20.2% !important; height:32.5% !important; }
.bl { left:6.9% !important; top:42.8% !important; width:44.4% !important; height:42.0% !important; }
.br { left:55.0% !important; top:42.8% !important; width:44.1% !important; height:42.0% !important; }

@media(max-width:1100px) {
  .tray {
    width:min(98vw, 920px) !important;
  }
  .slot.bl .food,
  .slot.br .food {

.tray-slot {
  background: linear-gradient(145deg, #f9efd9, #ecdfc2) !important;
  border-radius: 20px !important;
  box-shadow:
    inset 0 3px 10px rgba(120, 90, 60, 0.25),
    inset 0 -2px 4px rgba(255,255,255,0.6) !important;
  padding: 8px !important;
  display: flex !important;

  align-items: center !important;
  justify-content: center !important;

}

/* 슬롯 번호 = 음식 채워지는 순서: 1(밥) → 2(국) → 3,4,5,6(반찬) */

.tray-slot[data-slot="4"] { grid-column: 2 !important; grid-row: 1 !important; }
.tray-slot[data-slot="5"] { grid-column: 3 !important; grid-row: 1 !important; }
.tray-slot[data-slot="6"] { grid-column: 4 !important; grid-row: 1 !important; }
.tray-slot[data-slot="1"] { grid-column: 1 / 3 !important; grid-row: 2 !important; }
.tray-slot[data-slot="2"] { grid-column: 3 / 5 !important; grid-row: 2 !important; }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateParts() {
  const d = new Date();
  return [`${d.getMonth()+1}월 ${d.getDate()}일`, ['일','월','화','수','목','금','토'][d.getDay()] + '요일'];
}
function getJSON(k,f) { try { return JSON.parse(localStorage.getItem(k)) || f; } catch(e) { return f; } }
function setJSON(k,v) {
  try {
    localStorage.setItem(k, JSON.stringify(v));
    return true;
  } catch(e) {
    console.error('저장 실패:', e);
    alert('사진 용량이 커서 저장하지 못했어요. 사진을 자동으로 줄인 뒤 다시 저장해볼게요.');
    return false;
  }
}
function esc(s) { return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',1500); }

function openTab(id) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
  document.querySelector(`.tab[data-tab="${id}"]`)?.classList.add('active');
  if(id==='lunch') renderLunch();
  if(id==='question') renderQuestions();
  if(id==='story') renderStories();
}
document.addEventListener('click', e=> {
  const tab = e.target.closest('.tab[data-tab]');
  if(tab) openTab(tab.dataset.tab);
});

function init() {
  const [date,week] = dateParts();
  document.getElementById('dateText').innerHTML = `${date} <span class="weekday">${week}</span>`;
  document.getElementById('lunchDate').value = todayKey();

  const dateCard = document.getElementById('dateCard');
  if(dateCard){
    const toggleDateZoom = () => dateCard.classList.toggle('zoomed');
    dateCard.addEventListener('click', toggleDateZoom);
    dateCard.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toggleDateZoom();
      }
    });
  }

  renderWeather();
  initAirStationPicker();
  renderAirSaved();
  fetchAir();
  renderActivities();
  renderSchedule();
  renderLunch();
  renderQuestions();
  renderStories();
}

function getSavedWeathers() {
  const raw = getJSON(DB.WEATHER, {})[todayKey()];
  if(Array.isArray(raw)) return raw;
  if(raw) return [raw];
  return [];
}
function weatherIconHTML(icon, name, mode='button'){
  if(icon === 'WIND_IMG'){
    const cls = mode === 'big' ? 'wind-big' : 'wind-small';
    return `<img src="${WIND_ICON}" alt="${name}" class="weather-img ${cls}">`;
  }
  return `<span class="weather-emoji">${icon}</span>`;
}
function renderWeather() {
  const saved = getSavedWeathers();
  const orderedSaved = weathers.map(w => w[1]).filter(name => saved.includes(name));
  const big = document.getElementById('weatherBig');
  const bigText = document.getElementById('weatherBigText');

  if(big) {
    if(orderedSaved.length){
      big.innerHTML = orderedSaved.map(name => {
        const found = weathers.find(w => w[1] === name) || weathers[0];
        return `<span class="weather-chip-big" title="${found[1]}" aria-label="${found[1]}">
          <span class="ico">${weatherIconHTML(found[0], found[1], 'big')}</span>
          <span class="txt">${found[1]}</span>
        </span>`;
      }).join('');
    } else {
      big.innerHTML = `<span class="weather-empty">날씨를 골라요</span>`;
    }
  }

  if(bigText) bigText.textContent = '';

  document.getElementById('weatherList').innerHTML = weathers.map(w=>`
    <button class="weather-btn ${saved.includes(w[1])?'active':''}" onclick="setWeather('${w[1]}')" title="${w[1]}" aria-label="${w[1]}">
      <span class="w-ico">${weatherIconHTML(w[0], w[1], 'button')}</span>
      <span class="w-label">${w[1]}</span>
    </button>`).join('');
}
function setWeather(name) {
  const map = getJSON(DB.WEATHER,{});
  const current = getSavedWeathers();
  let next;
  if(current.includes(name)) {
    next = current.filter(x => x !== name);
  } else {
    next = [...current, name];
  }
  map[todayKey()] = next;
  setJSON(DB.WEATHER,map);
  renderWeather();
}
function getWeatherText() {
  return getSavedWeathers().join(', ');
}

function renderAirSaved() {
  const saved = getJSON(DB.AIR,{})[todayKey()];
  if(saved) {
    const visual = airValueToVisual(saved.text || saved.label || saved.icon || '조회 중');
    document.getElementById('airText').textContent = visual[1];
    document.getElementById('airIcon').textContent = visual[0];
    const timeEl = document.getElementById('airTime');
    const headEl = document.getElementById('airHeadTime');
    if(timeEl && saved.time) timeEl.textContent = `업데이트: ${saved.time} (${saved.station || '청학동'})`;

      const t = saved.time ? String(saved.time).split(' ')[1] || saved.time : '--:--';
      headEl.textContent = `업데이트: ${t}`;
    }
    const stationEl = document.getElementById('airStation');
    if(stationEl && saved.station) stationEl.value = saved.station;
    if(saved.station && typeof setAirStationUI === 'function') setAirStationUI(saved.station);

function fillAirStationOptions(gu, selected) {

  const list = BUSAN_AIR_STATIONS[gu] || [];
  stSel.innerHTML = list.map(n=>`<option value="${n}">${n}</option>`).join('');

  return {
    '1':['😊','좋음','#ffffff'],

async function fetchAir() {
  const stationInput = document.getElementById('airStation');
  const station = (stationInput?.value || '청학동').trim() || '청학동';
  const airText = document.getElementById('airText');
  const airIcon = document.getElementById('airIcon');
  const airCard = document.getElementById('airCard');
  const airTime = document.getElementById('airTime');

  const airHeadTime = document.getElementById('airHeadTime');
  if(airText) airText.textContent = '조회 중';
  if(airIcon) airIcon.textContent = '📡';
  if(airTime) airTime.textContent = `${station} 측정소 기준으로 확인합니다.`;
  if(airHeadTime) airHeadTime.textContent = '업데이트: 조회 중';

  try {
    const url =
      'https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty'
      + '?serviceKey=' + AIR_SERVICE_KEY
      + '&returnType=json'
      + '&numOfRows=1'
      + '&pageNo=1'
      + '&stationName=' + encodeURIComponent(station)
      + '&dataTerm=DAILY'
      + '&ver=1.4';

    const res = await fetch(url);
    if(!res.ok) throw new Error('NETWORK_ERROR');
    const data = await res.json();
    const item = data?.response?.body?.items?.[0];
    if(!item) throw new Error('NO_DATA');

    const grade = item.pm10Grade || item.khaiGrade || item.pm25Grade || '';
    const info = airByGrade(grade);
    const text = info[1];
    const icon = info[0];
    const time = item.dataTime || '';

    const shortTime = time ? time.split(' ')[1] : '-';
    if(airIcon) airIcon.textContent = icon;
    if(airText) airText.textContent = text;
    if(airCard) airCard.style.background = info[2];
    if(airTime) airTime.textContent = `업데이트: ${shortTime} (${station})`;
    if(airHeadTime) airHeadTime.textContent = `업데이트: ${shortTime}`;

    const map = getJSON(DB.AIR,{});
    map[todayKey()] = {text, icon, station, time};
    setJSON(DB.AIR,map);
  } catch(e) {
    console.warn('대기질 조회 실패:', e);
    if(airIcon) airIcon.textContent = '📡';
    if(airText) airText.textContent = '조회 실패';
    if(airCard) airCard.style.background = '#f1f3f5';
    if(airTime) airTime.textContent = '측정소명 또는 네트워크 상태를 확인해 주세요.';
    if(airHeadTime) airHeadTime.textContent = '업데이트: 실패';
  }
}

function manualMoveSchedule(inputEl) {
  const listEl = document.getElementById('scheduleList');
  const item = inputEl.closest('.schedule-item');
  const targetIndex = parseInt(inputEl.value, 10) - 1;
  const items = [...listEl.querySelectorAll('.schedule-item')];
  if(!item || isNaN(targetIndex)) { renderSchedule(); return; }
  if(targetIndex <= 0) listEl.insertBefore(item, items[0]);
  else if(targetIndex >= items.length) listEl.appendChild(item);
  else listEl.insertBefore(item, items[targetIndex]);
  saveScheduleFromDOM();
  renderSchedule();
}
function saveScheduleFromDOM() {
  const oldList = getSchedule();
  const order = [...document.querySelectorAll('#scheduleList .schedule-item')].map(el => el.dataset.id);

  saveSchedule(sorted);

function bindScheduleDrag() {
  const el = document.getElementById('scheduleList');
  if(!el || typeof Sortable === 'undefined') return;

  if(el._sortableInstance) {
    el._sortableInstance.destroy();
    el._sortableInstance = null;
  }

  el._sortableInstance = new Sortable(el, {
    animation: 220,
    easing: 'cubic-bezier(0.2, 0, 0, 1)',
    ghostClass: 'schedule-ghost',
    chosenClass: 'schedule-chosen',
    dragClass: 'schedule-drag',
    handle: '.schedule-item',
    onStart: () => el.classList.add('is-dragging'),
    onEnd: () => {
      el.classList.remove('is-dragging');
      saveScheduleFromDOM();
      renderSchedule();
    }
  });
}

function splitMenu(v) {
  return String(v||'').replaceAll(String.fromCharCode(13),'').replaceAll(String.fromCharCode(10),',').replaceAll('，',',').replaceAll('、',',').split(',').map(x=>x.trim()).filter(Boolean);

function lunchDate() { return document.getElementById('lunchDate').value || todayKey(); }
function getLunch() {
  const map = getJSON(DB.LUNCH,{});
  const arr = Array.isArray(map[lunchDate()]) ? map[lunchDate()] : [];
  const slotMap = {bl:'1', br:'2', tl:'3', tm1:'4', tm2:'5', tr:'6'};
  const normalized = arr.map((x,i)=> {
    if(typeof x === 'string') return {id:'old_'+i, text:x, slot:slotOrder[i%slotOrder.length]};
    const rawSlot = String(x.slot ?? slotOrder[i%slotOrder.length]);
    const fixedSlot = slotMap[rawSlot] || rawSlot;
    return {id:x.id, text:x.text, slot:slotOrder.includes(fixedSlot)?fixedSlot:slotOrder[i%slotOrder.length]};
  }).filter(x=>x.text);
  map[lunchDate()] = normalized;
  setJSON(DB.LUNCH,map);
  return normalized;
}
function saveLunch(arr) {
  const map = getJSON(DB.LUNCH,{});
  if(arr.length) map[lunchDate()] = arr;
  else delete map[lunchDate()];
  setJSON(DB.LUNCH,map);
}

function ensureFoodEditModal(){

  if(backdrop) return backdrop;

  backdrop.id = 'foodEditBackdrop';
  backdrop.className = 'food-edit-backdrop';
  backdrop.innerHTML = `
    <div class="food-edit-modal" role="dialog" aria-modal="true" aria-labelledby="foodEditTitle">

      <input class="food-edit-input" id="foodEditInput" type="text" autocomplete="off" maxlength="30">

        <button class="food-edit-save" id="foodEditSave" type="button">수정 완료</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  return backdrop;
}
function openFoodEditModal(value){
  return new Promise(resolve=>{
    const backdrop = ensureFoodEditModal();
    const input = backdrop.querySelector('#foodEditInput');
    const saveBtn = backdrop.querySelector('#foodEditSave');
    const cancelBtn = backdrop.querySelector('#foodEditCancel');
    let done = false;
    function close(result){
      if(done) return;
      done = true;
      backdrop.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      backdrop.removeEventListener('mousedown', onBackdrop);
      saveBtn.removeEventListener('click', onSave);
      if(cancelBtn) cancelBtn.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onSave(){
      const clean = input.value.trim();
      if(!clean){
        input.focus();
        input.classList.add('shake');
        setTimeout(()=>input.classList.remove('shake'),220);
        return;
      }
      close(clean);
    }
    function onCancel(){ close(null); }
    function onKey(ev){
      if(ev.key === 'Enter') onSave();
      if(ev.key === 'Escape') onCancel();
    }
    function onBackdrop(ev){
      if(ev.target === backdrop) onCancel();
    }
    input.value = value || '';
    backdrop.classList.add('show');
    saveBtn.addEventListener('click', onSave);
    if(cancelBtn) cancelBtn.addEventListener('click', onCancel);
    document.addEventListener('keydown', onKey);
    backdrop.addEventListener('mousedown', onBackdrop);
    setTimeout(()=>{ input.focus(); input.select(); }, 30);
  });
}

}

function renderLunch() {
  const arr = getLunch();
  const groups = Object.fromEntries(slotOrder.map(s=>[s,[]]));

function getUsefulImageBounds(img, width, height){
  // 바깥쪽 빈 여백만 자동으로 걷어내어 글자 자료와 사진이 같은 카드 안에서 더 크게 보이도록 합니다.
  try{
    const maxSample = 900;
    const sampleScale = Math.min(1, maxSample / Math.max(width, height));
    const sw = Math.max(1, Math.round(width * sampleScale));
    const sh = Math.max(1, Math.round(height * sampleScale));
    const sample = document.createElement('canvas');
    sample.width = sw;
    sample.height = sh;
    const sctx = sample.getContext('2d', { willReadFrequently:true });
    sctx.drawImage(img, 0, 0, width, height, 0, 0, sw, sh);
    const data = sctx.getImageData(0, 0, sw, sh).data;
    const idx = (x,y) => (y * sw + x) * 4;
    const blocks = [
      [0, 0, Math.min(18, sw), Math.min(18, sh)],
      [Math.max(0, sw - 18), 0, sw, Math.min(18, sh)],
      [0, Math.max(0, sh - 18), Math.min(18, sw), sh],
      [Math.max(0, sw - 18), Math.max(0, sh - 18), sw, sh]
    ];
    let r=0, g=0, b=0, n=0;
    for(const [x1,y1,x2,y2] of blocks){
      for(let y=y1; y<y2; y++){
        for(let x=x1; x<x2; x++){
          const k = idx(x,y);
          if(data[k+3] < 20) continue;
          r += data[k]; g += data[k+1]; b += data[k+2]; n++;
        }
      }
    }
    if(!n) return {sx:0, sy:0, sw:width, sh:height};
    r/=n; g/=n; b/=n;
    const threshold = 34;
    const isContent = (x,y) => {
      const k = idx(x,y);
      if(data[k+3] < 20) return false;
      const dr = data[k]-r, dg = data[k+1]-g, db = data[k+2]-b;
      return Math.sqrt(dr*dr + dg*dg + db*db) > threshold;
    };
    const rowMin = Math.max(2, Math.floor(sw * 0.004));
    const colMin = Math.max(2, Math.floor(sh * 0.004));
    let minX=sw, minY=sh, maxX=-1, maxY=-1;
    for(let y=0; y<sh; y++){
      let count=0;
      for(let x=0; x<sw; x++) if(isContent(x,y)) count++;
      if(count >= rowMin){ minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    }
    for(let x=0; x<sw; x++){
      let count=0;
      for(let y=0; y<sh; y++) if(isContent(x,y)) count++;
      if(count >= colMin){ minX = Math.min(minX, x); maxX = Math.max(maxX, x); }
    }
    if(maxX < minX || maxY < minY) return {sx:0, sy:0, sw:width, sh:height};
    const pad = 10;
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    maxX = Math.min(sw - 1, maxX + pad);
    maxY = Math.min(sh - 1, maxY + pad);
    const cropW = maxX - minX + 1;
    const cropH = maxY - minY + 1;
    if(cropW > sw * 0.97 && cropH > sh * 0.97) return {sx:0, sy:0, sw:width, sh:height};
    return {
      sx: Math.max(0, Math.round(minX / sampleScale)),
      sy: Math.max(0, Math.round(minY / sampleScale)),
      sw: Math.min(width, Math.round(cropW / sampleScale)),
      sh: Math.min(height, Math.round(cropH / sampleScale))
    };
  }catch(err){
    console.warn('사진 여백 정리를 건너뜁니다.', err);
    return {sx:0, sy:0, sw:width, sh:height};
  }
}

async function compressImageSource(src, targetW=1200, targetH=900, quality=.88){
  try{
    if(!src || typeof src !== 'string') return src;
    const img = await loadImage(src);
    const width = img.naturalWidth || img.width;
    const height = img.naturalHeight || img.height;
    if(!width || !height) return src;

    const crop = getUsefulImageBounds(img, width, height);
    const canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fffaf2';
    ctx.fillRect(0, 0, targetW, targetH);

    const innerPad = 6;
    const scale = Math.min((targetW - innerPad * 2) / crop.sw, (targetH - innerPad * 2) / crop.sh);
    const drawW = Math.round(crop.sw * scale);
    const drawH = Math.round(crop.sh * scale);
    const drawX = Math.round((targetW - drawW) / 2);
    const drawY = Math.round((targetH - drawH) / 2);
    ctx.drawImage(img, crop.sx, crop.sy, crop.sw, crop.sh, drawX, drawY, drawW, drawH);

    return canvas.toDataURL('image/jpeg', quality);
  }catch(err){
    console.warn('사진 압축을 건너뜁니다.', err);
    return src;
  }
}

  return [...(clipboardData.items || [])]

async function pastePhotoFromClipboard(){
  if(!isStoryDetailOpen()) return;
  if(!(navigator.clipboard && navigator.clipboard.read)){
    alert('키보드에서 Ctrl+V를 눌러주세요.');
    return;
  }
  try{
    const items = await navigator.clipboard.read();
    const files = [];
    for(const item of items){
      const imageType = item.types.find(type => type.startsWith('image/'));
      if(imageType){
        const blob = await item.getType(imageType);
        const ext = imageType.split('/')[1] || 'png';
        files.push(new File([blob], `추가한_사진_${Date.now()}.${ext}`, { type:imageType }));
      }
    }
    const added = await addPhotoFiles(files, '사진을 추가하고 저장했어요! 📸');
    if(!added) alert('클립보드에 사진이 없어요. 다시 시도해주세요.');
  }catch(err){
    alert('키보드에서 Ctrl+V를 눌러주세요.');
  }
}

function movePhoto(fromIndex, toIndex){
  if(fromIndex === null || toIndex === null) return;
  if(fromIndex < 0 || toIndex < 0 || fromIndex >= currentPhotos.length || toIndex >= currentPhotos.length) return;
  if(fromIndex === toIndex) return;
  const [moved] = currentPhotos.splice(fromIndex, 1);
  currentPhotos.splice(toIndex, 0, moved);
  draggedPhotoIndex = toIndex;
  renderPhotos();
}
function photoPointerDown(e, i){
  if(e.target.closest('.del-btn')) return;
  if(e.button !== undefined && e.button !== 0) return;
  draggedPhotoIndex = i;
  dragPointerId = e.pointerId;
  photoDragMoved = false;
  photoDragStartPoint = { x:e.clientX, y:e.clientY };
  renderPhotos();
  document.addEventListener('pointermove', photoPointerMove, { passive:false });
  document.addEventListener('pointerup', photoPointerUp, { passive:false });
  document.addEventListener('pointercancel', photoPointerCancel, { passive:false });
  e.preventDefault();
}
function photoPointerMove(e){
  if(dragPointerId !== e.pointerId || draggedPhotoIndex === null) return;
  const dx = Math.abs(e.clientX - photoDragStartPoint.x);
  const dy = Math.abs(e.clientY - photoDragStartPoint.y);
  if(dx > 4 || dy > 4) photoDragMoved = true;
  if(!photoDragMoved) return;
  const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.photo-card');
  const grid = document.getElementById('photoGrid');
  if(target && grid && grid.contains(target)){
    const targetIndex = Number(target.dataset.photoIndex);
    if(Number.isInteger(targetIndex)) movePhoto(draggedPhotoIndex, targetIndex);
  }
  e.preventDefault();
}
function finishPhotoDrag(saveOrder){
  document.removeEventListener('pointermove', photoPointerMove);
  document.removeEventListener('pointerup', photoPointerUp);
  document.removeEventListener('pointercancel', photoPointerCancel);
  dragPointerId = null;
  draggedPhotoIndex = null;
  renderPhotos();
  if(saveOrder){
    const saved = persistStoryPhotoOrder();
    if(saved) toast('사진을 원하는 위치로 옮기고 저장했어요! 📸');
  }
}
function photoPointerUp(e){
  if(dragPointerId !== e.pointerId) return;
  finishPhotoDrag(photoDragMoved);
  e.preventDefault();
}
function photoPointerCancel(e){
  if(dragPointerId !== e.pointerId) return;
  finishPhotoDrag(false);
}

async function captureElementAsImage(el, filename, bgColor='#ffffff'){

  // 캡쳐 시 textarea의 한글이 자모처럼 깨지거나, 긴 글이 잘리는 문제를 막기 위해
  // 화면 요소를 복제한 뒤 textarea를 일반 글상자로 바꾸어 전체 내용을 이미지로 저장합니다.
  if(document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch(e) {}
  }

  const wrap = document.createElement('div');
  wrap.className = 'capture-export-wrap';
  wrap.style.position = 'absolute';
  wrap.style.left = '-100000px';
  wrap.style.top = '0';
  wrap.style.background = bgColor;
  wrap.style.padding = '0';
  wrap.style.margin = '0';
  wrap.style.zIndex = '-1';

  const clone = el.cloneNode(true);
  clone.classList.add('capture-export');
  clone.style.display = 'block';
  clone.style.width = Math.max(el.scrollWidth, Math.ceil(el.getBoundingClientRect().width)) + 'px';
  clone.style.height = 'auto';
  clone.style.overflow = 'visible';

  clone.querySelectorAll('textarea').forEach(ta => {
    const box = document.createElement('div');
    box.className = (ta.className || '') + ' textarea-capture';
    box.textContent = ta.value || ta.textContent || '';
    const cs = window.getComputedStyle(ta);
    box.style.width = '100%';
    box.style.minHeight = Math.max(54, ta.scrollHeight || ta.offsetHeight || 54) + 'px';
    box.style.height = 'auto';
    box.style.padding = cs.padding;
    box.style.border = cs.border;
    box.style.background = cs.backgroundColor === 'rgba(0, 0, 0, 0)' ? 'transparent' : cs.background;
    box.style.color = cs.color;
    box.style.fontSize = cs.fontSize;
    box.style.fontWeight = cs.fontWeight;
    box.style.lineHeight = '1.45';
    box.style.whiteSpace = 'pre-wrap';
    box.style.wordBreak = 'keep-all';
    box.style.overflowWrap = 'anywhere';
    box.style.overflow = 'visible';
    box.style.fontFamily = "'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif";
    ta.replaceWith(box);
  });

  wrap.appendChild(clone);
  document.body.appendChild(wrap);

  // 레이아웃 계산이 끝난 뒤 실제 전체 크기로 캡쳐합니다.
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const targetWidth = Math.ceil(clone.scrollWidth);
  const targetHeight = Math.ceil(clone.scrollHeight);

  const canvas = await html2canvas(clone, {
    backgroundColor: bgColor,
    scale: 2,
    useCORS: true,
    allowTaint: true,
    scrollX: 0,
    scrollY: 0,
    width: targetWidth,
    height: targetHeight,
    windowWidth: targetWidth,
    windowHeight: targetHeight,
    foreignObjectRendering: false
  });

  wrap.remove();
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  link.remove();
  toast('스크린 캡쳐 이미지를 저장했어요.');
}

function excelEscape(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/\n/g,'<br>');
}
function downloadExcelFile(filename, sheetTitle, headers, rows){
  const tableRows = [
    '<tr>' + headers.map(h => `<th>${excelEscape(h)}</th>`).join('') + '</tr>',
    ...rows.map(row => '<tr>' + row.map(cell => `<td>${excelEscape(cell)}</td>`).join('') + '</tr>')
  ].join('');

  const excelDoc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="UTF-8">' +
    '<style>table{border-collapse:collapse;} th{background:#f7a1bd;color:#fff;font-weight:700;} th,td{border:1px solid #ddd;padding:8px;mso-number-format:"\\@";vertical-align:top;}</style>' +
    '</head><body><table>' + tableRows + '</table></body></html>';

  const blob = new Blob(['\ufeff', excelDoc], {type:'application/vnd.ms-excel;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 0);
}
function downloadQuestionExcel(){
  const threads = getTrainList();
  if(!threads.length) return alert('다운로드할 질문 기록이 없습니다.');
  const maxPairs = Math.max(...threads.map(t => Math.ceil((t.flow || []).length / 2)), 1);
  const headers = ['날짜'];
  for(let i=1; i<=maxPairs; i++){
    headers.push(`질문${i}`);
    headers.push(`답${i}`);
  }
  const rows = threads.map(t => {
    const row = [t.date || ''];
    const flow = t.flow || [];
    let qCount = 0;
    let aCount = 0;
    const pairs = [];
    flow.forEach(f => {
      if(f.type === 'q'){
        qCount++;
        if(!pairs[qCount-1]) pairs[qCount-1] = {q:'', a:''};
        pairs[qCount-1].q = f.text || '';
      } else {
        const target = Math.max(qCount-1, aCount);
        if(!pairs[target]) pairs[target] = {q:'', a:''};
        pairs[target].a = f.text || '';
        aCount++;
      }
    });
    for(let i=0; i<maxPairs; i++){
      row.push(pairs[i]?.q || '');
      row.push(pairs[i]?.a || '');
    }
    return row;
  });
  downloadExcelFile(`하루를_여는_질문_날짜별_${todayKey()}.xls`, '하루를 여는 질문', headers, rows);
}
function downloadStoryExcel(){
  const archive = getJSON(DB.STORY, []);
  if(!archive.length) return alert('다운로드할 이야기 기록이 없습니다.');
  const maxActivities = Math.max(...archive.map(a => String(a.schedule || '').split(' → ').filter(Boolean).length), 1);
  const headers = ['날짜', '날씨', '대기질'];
  for(let i=1; i<=maxActivities; i++) headers.push(`일과${i}`);
  headers.push('아이들 생각', '교사 기록', '사진 수');
  const rows = archive.map(a => {
    const acts = String(a.schedule || '').split(' → ').filter(Boolean);
    const row = [a.date || '', a.weather || '', a.air || ''];
    for(let i=0; i<maxActivities; i++) row.push((acts[i] || '').replace(/🍱\s*/g, ''));
    row.push(a.child || '', a.teacher || '', (a.photos || []).length);
    return row;
  });
  downloadExcelFile(`반짝반짝_우리들의_이야기_날짜별_${todayKey()}.xls`, '반짝반짝 우리들의 이야기', headers, rows);
}
